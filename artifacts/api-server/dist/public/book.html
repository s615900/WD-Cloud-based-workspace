<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>預約時間 - 生活記事</title>
<meta name="theme-color" content="#0B3D5C">
<style>
  :root {
    --navy: #0B3D5C;
    --gold: #D8A54B;
    --bg: #EEF3F6;
    --card-bg: #FFFFFF;
    --text: #1B2530;
    --text-muted: #6B7684;
    --dot-freeslot: #6FCF97;
    --danger: #D64545;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    background: var(--navy);
    color: #FFFFFF;
    padding: calc(env(safe-area-inset-top) + 26px) 20px 26px;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 6px;
  }

  header p {
    font-size: 13.5px;
    opacity: 0.8;
    margin: 0;
  }

  .header-curve {
    display: block;
    width: 100%;
    height: 26px;
  }

  .header-curve path { fill: var(--navy); }

  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 40px;
  }

  .day-block {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(11, 61, 92, 0.08);
  }

  .day-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 10px;
  }

  .slot-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid #EEF1F4;
  }

  .slot-row:first-of-type {
    border-top: none;
  }

  .slot-time-group {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .slot-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--dot-freeslot);
    flex-shrink: 0;
  }

  .slot-time {
    font-size: 15px;
    font-weight: 600;
  }

  .book-btn {
    flex-shrink: 0;
    border: none;
    border-radius: 10px;
    background: var(--gold);
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    padding: 9px 14px;
    cursor: pointer;
  }

  .book-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .empty-note {
    font-size: 13.5px;
    color: var(--text-muted);
    margin: 0;
  }

  .loading, .error-note {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    background: var(--navy);
    color: #FFFFFF;
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(11, 61, 92, 0.3);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    max-width: calc(100% - 40px);
    text-align: center;
  }

  .toast.error { background: var(--danger); }
  .toast.show { opacity: 1; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(11, 61, 92, 0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }

  .modal-overlay.hidden { display: none; }

  .modal-card {
    background: var(--card-bg);
    width: 100%;
    max-width: 480px;
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(env(safe-area-inset-bottom) + 20px);
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .modal-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 16px;
  }

  .modal-card input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #E0E4E8;
    background: var(--bg);
    font-size: 15px;
    color: var(--text);
    font-family: inherit;
  }

  .modal-msg {
    margin: 8px 0 0;
    font-size: 12.5px;
    color: var(--danger);
    min-height: 16px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .modal-actions button {
    flex: 1;
    padding: 13px 0;
    border: none;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .modal-cancel-btn {
    background: var(--bg);
    color: var(--text);
  }

  .modal-submit-btn {
    background: var(--navy);
    color: #FFFFFF;
  }

  .modal-submit-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .confirm-icon {
    font-size: 40px;
    text-align: center;
    margin: 4px 0 12px;
  }

  .confirm-msg {
    font-size: 15.5px;
    font-weight: 600;
    text-align: center;
    line-height: 1.5;
    margin: 0 0 20px;
  }

  .confirm-close-btn {
    width: 100%;
    padding: 13px 0;
    border: none;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: var(--navy);
    color: #FFFFFF;
  }
</style>
</head>
<body>
<header>
  <h1>預約 WD 的時間</h1>
  <p id="date-range">選一個時段，填上你的名字送出</p>
</header>
<svg class="header-curve" viewBox="0 0 100 30" preserveAspectRatio="none">
  <path d="M0,0 L100,0 L100,4 Q50,30 0,4 Z"></path>
</svg>

<main id="result">
  <p class="loading">載入中…</p>
</main>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-card">
    <p class="modal-title" id="modal-title">預約這個時段</p>
    <p class="modal-sub">請輸入你的名字，WD 會收到通知</p>
    <input type="text" id="modal-name-input" placeholder="你的名字" autocomplete="off" maxlength="20">
    <p class="modal-msg" id="modal-msg"></p>
    <div class="modal-actions">
      <button type="button" class="modal-cancel-btn" id="modal-cancel-btn">取消</button>
      <button type="button" class="modal-submit-btn" id="modal-submit-btn" disabled>送出預約</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="confirm-overlay">
  <div class="modal-card">
    <p class="confirm-icon">📨</p>
    <p class="confirm-msg" id="confirm-msg"></p>
    <button type="button" class="confirm-close-btn" id="confirm-close-btn">返回列表</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  var resultEl = document.getElementById("result");

  function renderDay(day) {
    var slotsHtml = (day.slots && day.slots.length)
      ? day.slots.map(function (slot) {
          return (
            '<div class="slot-row" data-slot-id="' + escapeHtml(slot.id) + '">' +
              '<span class="slot-time-group">' +
                '<span class="slot-dot"></span>' +
                '<span class="slot-time">' + escapeHtml(slot.start) + ' - ' + escapeHtml(slot.end) + '</span>' +
              '</span>' +
              '<button type="button" class="book-btn" data-id="' + escapeHtml(slot.id) +
                '" data-date-label="' + escapeHtml(day.dayLabel || day.date) +
                '" data-time-label="' + escapeHtml(slot.start) + ' - ' + escapeHtml(slot.end) + '">預約這個時段</button>' +
            '</div>'
          );
        }).join("")
      : '<p class="empty-note">這天沒有可預約的時段了</p>';

    return (
      '<div class="day-block" data-date="' + escapeHtml(day.date) + '">' +
        '<h2 class="day-title">' + escapeHtml(day.dayLabel || day.date) + '</h2>' +
        '<div class="slot-list">' + slotsHtml + '</div>' +
      '</div>'
    );
  }

  async function loadBook() {
    try {
      var res = await fetch("/api/book");
      if (!res.ok) throw new Error("HTTP " + res.status);
      var days = await res.json();

      resultEl.innerHTML = days.length
        ? days.map(renderDay).join("")
        : '<p class="error-note">目前沒有可預約的時段</p>';
    } catch (err) {
      console.error("載入可預約時段失敗:", err);
      resultEl.innerHTML = '<p class="error-note">載入失敗，請稍後再試</p>';
    }
  }

  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  function showToast(message, isError) {
    toastEl.textContent = message;
    toastEl.classList.toggle("error", !!isError);
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 3200);
  }

  // 預約成功後直接把那張卡片從畫面上移除，不用重新整理；
  // 若該日期底下已經沒有其他時段，整個 day-block 也一併移除。
  function removeSlotRow(id) {
    var row = resultEl.querySelector('.slot-row[data-slot-id="' + id + '"]');
    if (!row) return;
    var dayBlock = row.closest(".day-block");
    row.remove();
    if (dayBlock && !dayBlock.querySelector(".slot-row")) {
      dayBlock.remove();
    }
    if (!resultEl.querySelector(".day-block")) {
      resultEl.innerHTML = '<p class="error-note">目前沒有可預約的時段</p>';
    }
  }

  var modalOverlay = document.getElementById("modal-overlay");
  var modalTitle = document.getElementById("modal-title");
  var modalNameInput = document.getElementById("modal-name-input");
  var modalMsg = document.getElementById("modal-msg");
  var modalSubmitBtn = document.getElementById("modal-submit-btn");
  var modalCancelBtn = document.getElementById("modal-cancel-btn");
  var confirmOverlay = document.getElementById("confirm-overlay");
  var confirmMsg = document.getElementById("confirm-msg");
  var confirmCloseBtn = document.getElementById("confirm-close-btn");
  var currentSlotId = null;
  var currentDateLabel = "";
  var currentTimeLabel = "";

  function updateSubmitBtnState() {
    modalSubmitBtn.disabled = modalNameInput.value.trim().length === 0;
  }

  function openModal(id, dateLabel, timeLabel) {
    currentSlotId = id;
    currentDateLabel = dateLabel;
    currentTimeLabel = timeLabel;
    modalTitle.textContent = "預約 " + dateLabel + " " + timeLabel;
    modalNameInput.value = "";
    modalMsg.textContent = "";
    modalSubmitBtn.textContent = "送出預約";
    updateSubmitBtnState();
    modalOverlay.classList.remove("hidden");
    modalNameInput.focus();
  }

  function closeModal() {
    modalOverlay.classList.add("hidden");
    currentSlotId = null;
  }

  function showConfirmation(dateLabel, timeLabel) {
    confirmMsg.textContent = "已送出 " + dateLabel + " " + timeLabel + " 的預約申請，等 WD 確認後才成立";
    confirmOverlay.classList.remove("hidden");
  }

  function closeConfirmation() {
    confirmOverlay.classList.add("hidden");
  }

  resultEl.addEventListener("click", function (evt) {
    var btn = evt.target.closest(".book-btn");
    if (!btn) return;
    openModal(btn.dataset.id, btn.dataset.dateLabel, btn.dataset.timeLabel);
  });

  modalCancelBtn.addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", function (evt) {
    if (evt.target === modalOverlay) closeModal();
  });
  modalNameInput.addEventListener("input", updateSubmitBtnState);

  confirmCloseBtn.addEventListener("click", closeConfirmation);
  confirmOverlay.addEventListener("click", function (evt) {
    if (evt.target === confirmOverlay) closeConfirmation();
  });

  async function submitBooking() {
    var name = modalNameInput.value.trim();
    if (!name) {
      modalMsg.textContent = "請輸入你的名字";
      return;
    }
    if (name.length > 20) {
      modalMsg.textContent = "名字請控制在 20 字以內";
      return;
    }

    var id = currentSlotId;
    var dateLabel = currentDateLabel;
    var timeLabel = currentTimeLabel;
    modalSubmitBtn.disabled = true;
    modalSubmitBtn.textContent = "送出中…";
    modalMsg.textContent = "";

    try {
      var res = await fetch("/api/book/" + encodeURIComponent(id), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name }),
      });
      var data = await res.json().catch(function () { return {}; });

      if (res.status === 409) {
        closeModal();
        showToast(data.error || "這個時段剛被別人預約走了，請選別的時段", true);
        loadBook();
        return;
      }

      if (!res.ok || !data.success) {
        throw new Error(data.error || "HTTP " + res.status);
      }

      closeModal();
      removeSlotRow(id);
      showConfirmation(dateLabel, timeLabel);
    } catch (err) {
      console.error("預約失敗:", err);
      modalMsg.textContent = "送出失敗，請稍後再試";
      updateSubmitBtnState();
      modalSubmitBtn.textContent = "送出預約";
    }
  }

  modalSubmitBtn.addEventListener("click", submitBooking);
  modalNameInput.addEventListener("keydown", function (evt) {
    if (evt.key === "Enter" && !modalSubmitBtn.disabled) submitBooking();
  });

  loadBook();
</script>
</body>
</html>
