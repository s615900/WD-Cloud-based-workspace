<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空檔時間分享 - 生活記事</title>
<meta name="theme-color" content="#0B3D5C">
<style>
  :root {
    --navy: #0B3D5C;
    --gold: #D8A54B;
    --bg: #EEF3F6;
    --card-bg: #FFFFFF;
    --text: #1B2530;
    --text-muted: #6B7684;
    --dot-freeslot: #6FCF97;
    --dot-booked: #E0A83E;
    --dot-cancelled: #B0B8C1;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    background: var(--navy);
    color: #FFFFFF;
    padding: calc(env(safe-area-inset-top) + 26px) 20px 26px;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 6px;
  }

  header p {
    font-size: 13.5px;
    opacity: 0.8;
    margin: 0;
  }

  .header-curve {
    display: block;
    width: 100%;
    height: 26px;
  }

  .header-curve path { fill: var(--navy); }

  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 40px;
  }

  .day-block {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(11, 61, 92, 0.08);
  }

  .day-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 10px;
  }

  .slot-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid #EEF1F4;
  }

  .slot-row:first-of-type {
    border-top: none;
  }

  .slot-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--dot-freeslot);
    flex-shrink: 0;
  }

  .slot-dot.booked { background: var(--dot-booked); }
  .slot-dot.cancelled { background: var(--dot-cancelled); }

  .slot-time {
    font-size: 15px;
    font-weight: 600;
  }

  .slot-booked-name {
    font-size: 13px;
    color: var(--text-muted);
    margin-left: 4px;
  }

  .empty-note {
    font-size: 13.5px;
    color: var(--text-muted);
    margin: 0;
  }

  .loading, .error-note {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
    font-size: 14px;
  }
</style>
</head>
<body>
<header>
  <h1>WD 的空檔時間</h1>
  <p id="date-range">即時更新</p>
</header>
<svg class="header-curve" viewBox="0 0 100 30" preserveAspectRatio="none">
  <path d="M0,0 L100,0 L100,4 Q50,30 0,4 Z"></path>
</svg>

<main id="result">
  <p class="loading">載入中…</p>
</main>

<script>
  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function renderDay(day) {
    var slotsHtml = (day.slots && day.slots.length)
      ? day.slots.map(function (slot) {
          var status = slot.bookingStatus || "可預約";
          var dotClass = status === "已預約" ? "booked" : (status === "已取消" ? "cancelled" : "");
          var nameHtml = (status === "已預約" && slot.bookedBy)
            ? '<span class="slot-booked-name">（' + escapeHtml(slot.bookedBy) + '）</span>'
            : "";
          return (
            '<div class="slot-row">' +
              '<span class="slot-dot ' + dotClass + '"></span>' +
              '<span class="slot-time">' + escapeHtml(slot.start) + ' - ' + escapeHtml(slot.end) + '</span>' +
              nameHtml +
            '</div>'
          );
        }).join("")
      : '<p class="empty-note">這天還沒安排空檔時間</p>';

    return (
      '<div class="day-block">' +
        '<h2 class="day-title">' + escapeHtml(day.dayLabel || day.date) + '</h2>' +
        slotsHtml +
      '</div>'
    );
  }

  async function loadShare() {
    var resultEl = document.getElementById("result");

    try {
      var res = await fetch("/api/share");
      if (!res.ok) throw new Error("HTTP " + res.status);
      var days = await res.json();

      resultEl.innerHTML = days.length
        ? days.map(renderDay).join("")
        : '<p class="error-note">目前還沒有安排空檔時間</p>';
    } catch (err) {
      console.error("載入分享空檔失敗:", err);
      resultEl.innerHTML = '<p class="error-note">載入失敗，請稍後再試</p>';
    }
  }

  loadShare();
</script>
</body>
</html>
