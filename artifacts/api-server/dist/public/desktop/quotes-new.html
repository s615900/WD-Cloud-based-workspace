<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新增報價單 - 個人工作台</title>
<meta name="theme-color" content="#0B3D5C">
<link rel="stylesheet" href="/desktop/desktop.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-root"></aside>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 id="page-title">新增報價單</h1>
        <p class="subtitle">畫面上的金額是依目前品項即時試算，送出後會導向這筆報價單的詳情頁</p>
      </div>
      <div class="page-actions">
        <a class="btn btn-outline" href="/desktop/quotes.html">‹ 返回列表</a>
      </div>
    </div>

    <form id="quote-form">
      <div class="card" style="margin-bottom: 20px;">
        <h3>客戶資料</h3>
        <div class="form-grid">
          <div class="form-field">
            <label>客戶<span class="required">*</span></label>
            <select id="f-client"><option value="">載入中…</option></select>
          </div>
        </div>
        <p class="form-hint" style="margin-top: 14px;">選定客戶後會立即帶入以下欄位，也可以在這裡覆蓋：</p>
        <div class="form-grid">
          <div class="form-field"><label>客戶名稱</label><input type="text" id="f-client-name" placeholder="自動帶入"></div>
          <div class="form-field"><label>統一編號</label><input type="text" id="f-taxid" placeholder="自動帶入"></div>
          <div class="form-field span-2"><label>聯絡地址</label><input type="text" id="f-address" placeholder="自動帶入"></div>
          <div class="form-field"><label>聯絡人</label><input type="text" id="f-contact" placeholder="自動帶入"></div>
          <div class="form-field"><label>公司電話</label><input type="text" id="f-company-phone" placeholder="自動帶入"></div>
          <div class="form-field"><label>聯絡人電話</label><input type="text" id="f-contact-phone" placeholder="自動帶入"></div>
          <div class="form-field"><label>電子郵件</label><input type="text" id="f-email" placeholder="自動帶入"></div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 20px;">
        <h3>報價資訊</h3>
        <div class="form-grid">
          <div class="form-field span-2">
            <label>專案名稱<span class="required">*</span></label>
            <input type="text" id="f-project-name" placeholder="例如：王小明婚禮紀錄">
            <p class="form-hint">若和既有報價單撞名，儲存時會自動加上 -2、-3 後綴，不用自己改名</p>
          </div>
          <div class="form-field">
            <label>報價日期<span class="required">*</span></label>
            <input type="date" id="f-date">
          </div>
          <div class="form-field">
            <label>報價有效期限</label>
            <input type="date" id="f-valid-until">
          </div>
          <div class="form-field">
            <label>課稅別</label>
            <div class="static-field">營業稅</div>
          </div>
          <div class="form-field">
            <label>稅率</label>
            <div class="static-field">5%</div>
          </div>
          <div class="form-field">
            <label>計稅方式</label>
            <select id="f-tax-mode">
              <option value="稅外加">稅外加（單價未稅，另外加稅額）</option>
              <option value="稅內含">稅內含（單價已含稅）</option>
            </select>
          </div>
          <div class="form-field">
            <label>折扣率</label>
            <select id="f-discount">
              <option value="100">100%（不打折）</option>
              <option value="95">95%</option>
              <option value="90">90%</option>
              <option value="85">85%</option>
              <option value="80">80%</option>
            </select>
          </div>
          <div class="form-field span-2">
            <label>特別說明</label>
            <textarea id="f-note"></textarea>
          </div>
          <div class="form-field span-2">
            <label>合約條款內容</label>
            <textarea id="f-contract-terms" placeholder="客戶在簽署頁會看到這段文字，簽名前需確認閱讀"></textarea>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 20px;">
        <div class="card-title-row">
          <h3>品項</h3>
          <button type="button" class="btn btn-outline" id="add-item-btn">+ 新增品項</button>
        </div>
        <div style="overflow-x: auto;">
          <table class="data-table">
            <thead><tr><th>品項</th><th style="width:110px;">單價</th><th style="width:90px;">單位</th><th style="width:90px;">數量</th><th>備註</th><th></th></tr></thead>
            <tbody id="items-body"><tr><td colspan="6" class="empty-hint">尚未加入品項</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3>金額試算</h3>
        <p class="form-hint" style="margin-bottom: 12px;">依目前品項即時計算，不用等送出存檔</p>
        <div class="calc-summary">
          <div class="calc-row"><span>品項小計</span><span id="calc-subtotal">$0</span></div>
          <div class="calc-row"><span>套用折扣後金額</span><span id="calc-after-discount">$0</span></div>
          <div class="calc-row"><span>未稅金額</span><span id="calc-untaxed">$0</span></div>
          <div class="calc-row"><span>稅額（5%）</span><span id="calc-tax">$0</span></div>
          <div class="calc-row calc-total"><span>總金額（含稅）</span><span id="calc-total">$0</span></div>
        </div>
      </div>

      <div style="margin-top: 20px;">
        <button type="submit" class="btn btn-gold" id="save-btn">儲存報價單</button>
        <p class="message" id="form-message"></p>
      </div>
    </form>
  </main>
</div>

<div class="modal-overlay hidden" id="picker-overlay">
  <div class="modal-box">
    <h2>選擇產品／服務</h2>
    <input type="text" id="picker-search" placeholder="搜尋名稱或編號…" style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);margin-bottom:14px;">
    <div id="picker-list" style="max-height: 360px; overflow-y: auto;"><p class="empty-hint">載入中…</p></div>
    <div class="page-actions" style="margin-top: 16px; justify-content: flex-end;">
      <button type="button" class="btn btn-outline" id="picker-close">關閉</button>
    </div>
  </div>
</div>

<style>
  .static-field {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #F7FAFC;
    color: var(--text);
    font-size: 14px;
  }
  .calc-summary { display: flex; flex-direction: column; gap: 8px; max-width: 420px; }
  .calc-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .calc-row.calc-total { border-top: 2px solid var(--border); margin-top: 6px; padding-top: 10px; font-size: 18px; font-weight: 700; }
</style>

<script src="/desktop/common.js"></script>
<script src="/desktop/nav.js" data-active="quotes"></script>
<script>
(function () {
  var C = window.DesktopCommon;
  var params = new URLSearchParams(window.location.search);
  var editId = params.get("id");
  var products = [];
  var clients = [];
  var items = []; // { productId, name, price, unit, qty, note }
  var TAX_RATE = 0.05; // 目前系統只支援單一稅率（營業稅 5%），固定不做成選單
  var DISCOUNT_OPTIONS = [100, 95, 90, 85, 80];

  if (editId) {
    document.getElementById("page-title").textContent = "編輯報價單";
  } else {
    document.getElementById("f-date").value = C.todayISO();
  }

  async function loadClients() {
    var select = document.getElementById("f-client");
    try {
      clients = await C.apiFetch("/api/clients");
      // 選項的 value 用客戶編號（例：C-0002），不是 Ragic 內部紀錄編號——後面存進 Ragic
      // 「客戶編號」連結欄位（1000127）就是要這個顯示值，寫內部紀錄編號 Ragic 會判定
      // 無效連結、存成空白。
      select.innerHTML = '<option value="">請選擇客戶</option>' + clients.map(function (c) {
        return '<option value="' + C.escapeHtml(c.code) + '">' + C.escapeHtml(c.name) + (c.taxId ? "（" + C.escapeHtml(c.taxId) + "）" : "") + '</option>';
      }).join("");
    } catch (err) {
      clients = [];
      select.innerHTML = '<option value="">客戶載入失敗</option>';
    }
  }

  // 客戶下拉選單一選定就立即帶入關聯欄位的實際值（不用等送出存進 Ragic），
  // 欄位本身仍是可編輯的輸入框，這裡只是預填初始值，使用者可以再手動覆蓋。
  function applyClientDefaults(clientId) {
    var client = clients.find(function (c) { return String(c.code) === String(clientId); });
    if (!client) return;
    document.getElementById("f-client-name").value = client.name || "";
    document.getElementById("f-taxid").value = client.taxId || "";
    document.getElementById("f-address").value = client.address || "";
    document.getElementById("f-contact").value = client.contact || "";
    document.getElementById("f-company-phone").value = client.companyPhone || "";
    document.getElementById("f-contact-phone").value = client.contactPhone || "";
    document.getElementById("f-email").value = client.email || "";
  }

  document.getElementById("f-client").addEventListener("change", function (e) {
    applyClientDefaults(e.target.value);
  });

  async function loadProducts() {
    try {
      products = await C.apiFetch("/api/products");
    } catch (err) {
      products = [];
    }
  }

  // 折扣率下拉只提供 80/85/90/95/100 五個級距，畫面上就是這幾個百分比選項，
  // Ragic 那邊實際存的是小數倍率（例：90% -> "0.9"），送出時才做這層單位轉換。
  // 編輯既有報價單時，如果原始折扣率不剛好落在這 5 個級距上（例如舊資料手動打過其他數字），
  // 動態補一個選項顯示真實數值並選取，不要在使用者沒有改動的情況下悄悄把資料變成別的級距。
  function setDiscountSelect(rawDiscountRate) {
    var select = document.getElementById("f-discount");
    var percent = Math.round(Number(rawDiscountRate) * 100);
    if (!Number.isFinite(percent) || rawDiscountRate === "" || rawDiscountRate === undefined) {
      select.value = "100";
      return;
    }
    if (DISCOUNT_OPTIONS.indexOf(percent) === -1) {
      var opt = document.createElement("option");
      opt.value = String(percent);
      opt.textContent = percent + "%（原始值）";
      select.insertBefore(opt, select.firstChild);
    }
    select.value = String(percent);
  }

  async function loadExisting() {
    if (!editId) return;
    try {
      var detail = await C.apiFetch("/api/quotes/" + editId);
      document.getElementById("page-title").textContent = "編輯報價單 " + (detail.quoteNumber || ("#" + editId));
      document.getElementById("f-client").value = detail.clientId;
      document.getElementById("f-date").value = (detail.quoteDate || "").replaceAll("/", "-");
      document.getElementById("f-valid-until").value = (detail.validUntil || "").replaceAll("/", "-");
      document.getElementById("f-note").value = detail.note || "";
      document.getElementById("f-project-name").value = detail.projectName || "";
      document.getElementById("f-tax-mode").value = detail.taxMode || "稅外加";
      document.getElementById("f-contract-terms").value = detail.contractTerms || "";
      document.getElementById("f-client-name").value = detail.clientName || "";
      document.getElementById("f-taxid").value = detail.taxId || "";
      document.getElementById("f-address").value = detail.address || "";
      document.getElementById("f-contact").value = detail.contact || "";
      document.getElementById("f-company-phone").value = detail.companyPhone || "";
      document.getElementById("f-contact-phone").value = detail.contactPhone || "";
      document.getElementById("f-email").value = detail.email || "";
      setDiscountSelect(detail.discountRate);
      items = (detail.items || []).map(function (item) {
        return { productId: item.productId, name: item.name, price: item.price, unit: item.unit, qty: item.qty, note: item.note };
      });
      renderItems();
    } catch (err) {
      C.showMessage(document.getElementById("form-message"), "載入既有報價單失敗：" + err.message, "error");
    }
  }

  function renderItems() {
    var body = document.getElementById("items-body");
    if (items.length === 0) {
      body.innerHTML = '<tr><td colspan="6" class="empty-hint">尚未加入品項</td></tr>';
      recalculate();
      return;
    }
    body.innerHTML = items.map(function (item, index) {
      return '<tr>' +
        '<td>' + C.escapeHtml(item.name) + '<div class="form-hint">' + C.escapeHtml(item.productId) + '</div></td>' +
        '<td><input type="text" data-field="price" data-index="' + index + '" value="' + C.escapeHtml(item.price) + '"></td>' +
        '<td><input type="text" data-field="unit" data-index="' + index + '" value="' + C.escapeHtml(item.unit) + '"></td>' +
        '<td><input type="text" data-field="qty" data-index="' + index + '" value="' + C.escapeHtml(item.qty) + '"></td>' +
        '<td><input type="text" data-field="note" data-index="' + index + '" value="' + C.escapeHtml(item.note || "") + '"></td>' +
        '<td><button type="button" class="btn btn-danger" data-remove="' + index + '" style="padding:5px 10px;font-size:12px;">移除</button></td>' +
        '</tr>';
    }).join("");

    body.querySelectorAll("input[data-field]").forEach(function (input) {
      input.style.width = "100%";
      input.style.padding = "6px 8px";
      input.style.border = "1px solid var(--border)";
      input.style.borderRadius = "6px";
      input.addEventListener("input", function () {
        items[Number(input.dataset.index)][input.dataset.field] = input.value;
        recalculate();
      });
    });
    body.querySelectorAll("button[data-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        items.splice(Number(btn.dataset.remove), 1);
        renderItems();
      });
    });
    recalculate();
  }

  function formatCurrency(n) {
    var rounded = Math.round((Number(n) || 0) * 100) / 100;
    return "$" + rounded.toLocaleString("en-US");
  }

  // 純前端即時試算：不等送出存檔、不等 Ragic 公式跑完。折扣率／稅率／計稅方式跟送出時
  // 實際換算給 Ragic 的邏輯完全對齊（見 routes/quotes.ts calcQuoteTotals），
  // 這樣試算數字才會跟送出後 Ragic 算出來的金額一致。
  function recalculate() {
    var subtotal = items.reduce(function (sum, item) {
      var price = parseFloat(item.price) || 0;
      var qty = parseFloat(item.qty) || 0;
      return sum + price * qty;
    }, 0);
    var discountPercent = Number(document.getElementById("f-discount").value) || 100;
    var afterDiscount = subtotal * (discountPercent / 100);
    var taxMode = document.getElementById("f-tax-mode").value;
    var untaxed, tax, total;
    if (taxMode === "稅內含") {
      untaxed = afterDiscount / (1 + TAX_RATE);
      total = afterDiscount;
      tax = total - untaxed;
    } else {
      untaxed = afterDiscount;
      tax = untaxed * TAX_RATE;
      total = untaxed + tax;
    }

    document.getElementById("calc-subtotal").textContent = formatCurrency(subtotal);
    document.getElementById("calc-after-discount").textContent = formatCurrency(afterDiscount);
    document.getElementById("calc-untaxed").textContent = formatCurrency(untaxed);
    document.getElementById("calc-tax").textContent = formatCurrency(tax);
    document.getElementById("calc-total").textContent = formatCurrency(total);
  }

  document.getElementById("f-discount").addEventListener("change", recalculate);
  document.getElementById("f-tax-mode").addEventListener("change", recalculate);

  var pickerOverlay = document.getElementById("picker-overlay");

  function renderPickerList(filterText) {
    var list = document.getElementById("picker-list");
    var filtered = products.filter(function (p) {
      if (!filterText) return true;
      var t = filterText.toLowerCase();
      return p.name.toLowerCase().includes(t) || p.code.toLowerCase().includes(t);
    });
    if (filtered.length === 0) {
      list.innerHTML = '<p class="empty-hint">沒有符合的產品</p>';
      return;
    }
    list.innerHTML = filtered.map(function (p) {
      return '<div class="kanban-card" data-id="' + p.id + '" style="cursor:pointer;">' +
        '<div style="display:flex;justify-content:space-between;"><strong>' + C.escapeHtml(p.name) + '</strong><span class="badge badge-gold">' + C.escapeHtml(p.price) + '</span></div>' +
        '<div class="form-hint">' + C.escapeHtml(p.code) + '・' + C.escapeHtml(p.category) + '・' + C.escapeHtml(p.unit) + '</div></div>';
    }).join("");
    list.querySelectorAll("[data-id]").forEach(function (el) {
      el.addEventListener("click", function () {
        var product = products.find(function (p) { return p.id === Number(el.dataset.id); });
        if (!product) return;
        // productId 存產品編號（例：運動賽事拍攝00001），不是 Ragic 內部紀錄編號——
        // 理由跟客戶編號連結欄位一樣，寫內部紀錄編號 Ragic 會判定無效連結、存成空白。
        items.push({ productId: product.code, name: product.name, price: product.price, unit: product.unit, qty: "1", note: "" });
        renderItems();
        pickerOverlay.classList.add("hidden");
      });
    });
  }

  document.getElementById("add-item-btn").addEventListener("click", function () {
    pickerOverlay.classList.remove("hidden");
    document.getElementById("picker-search").value = "";
    renderPickerList("");
  });
  document.getElementById("picker-close").addEventListener("click", function () { pickerOverlay.classList.add("hidden"); });
  pickerOverlay.addEventListener("click", function (e) { if (e.target === pickerOverlay) pickerOverlay.classList.add("hidden"); });
  document.getElementById("picker-search").addEventListener("input", function (e) { renderPickerList(e.target.value); });

  document.getElementById("quote-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    var messageEl = document.getElementById("form-message");
    var clientId = document.getElementById("f-client").value;
    var date = document.getElementById("f-date").value;
    var projectName = document.getElementById("f-project-name").value.trim();
    if (!clientId) { C.showMessage(messageEl, "請選擇客戶", "error"); return; }
    if (!date) { C.showMessage(messageEl, "請選擇報價日期", "error"); return; }
    if (!projectName) { C.showMessage(messageEl, "請填寫專案名稱", "error"); return; }
    for (var i = 0; i < items.length; i++) {
      if (!items[i].qty) { C.showMessage(messageEl, "第 " + (i + 1) + " 項品項請填寫數量", "error"); return; }
    }

    function optional(id) {
      var v = document.getElementById(id).value.trim();
      return v === "" ? undefined : v;
    }

    var discountPercent = Number(document.getElementById("f-discount").value) || 100;

    var payload = {
      clientId: clientId,
      projectName: projectName,
      quoteDate: date,
      validUntil: optional("f-valid-until"),
      taxType: "營業稅",
      taxMode: document.getElementById("f-tax-mode").value,
      taxRate: String(TAX_RATE),
      discountRate: String(discountPercent / 100),
      note: optional("f-note"),
      contractTerms: optional("f-contract-terms"),
      clientName: optional("f-client-name"),
      taxId: optional("f-taxid"),
      address: optional("f-address"),
      contact: optional("f-contact"),
      companyPhone: optional("f-company-phone"),
      contactPhone: optional("f-contact-phone"),
      email: optional("f-email"),
      items: items.map(function (item) {
        return { productId: item.productId, name: item.name, price: item.price, unit: item.unit, qty: item.qty, note: item.note };
      }),
    };
    Object.keys(payload).forEach(function (k) { if (payload[k] === undefined) delete payload[k]; });

    var saveBtn = document.getElementById("save-btn");
    saveBtn.disabled = true;
    C.showMessage(messageEl, "儲存中…");
    try {
      var targetId = editId;
      if (editId) {
        await C.apiFetch("/api/quotes/" + editId, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      } else {
        var created = await C.apiFetch("/api/quotes", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        targetId = created.id;
      }
      C.showMessage(messageEl, "已儲存，正在前往詳情頁…", "success");
      window.location.href = "/desktop/quotes-detail.html?id=" + targetId;
    } catch (err) {
      C.showMessage(messageEl, err.message || "儲存失敗", "error");
      saveBtn.disabled = false;
    }
  });

  // 客戶下拉的選項要先載入完成，loadExisting() 裡設定 select 的 value 才選得中既有客戶，
  // 之前 loadClients() 沒有被 loadExisting() 等待，兩個請求各自非同步跑，
  // 如果 /api/products 先回來，loadExisting() 會在客戶選單還只有「載入中…」的時候就設值，
  // 結果永遠選不中，畫面上就會一直停在「請選擇客戶」。
  Promise.all([loadClients(), loadProducts()]).then(loadExisting).then(recalculate);
})();
</script>
</body>
</html>
