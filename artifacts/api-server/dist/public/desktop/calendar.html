<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行事曆 - 個人工作台</title>
<meta name="theme-color" content="#0B3D5C">
<link rel="stylesheet" href="/desktop/desktop.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-root"></aside>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>行事曆</h1>
        <p class="subtitle">班別模板、重複排班、空檔推算與公布——跟手機版行程資料共用同一張排班表</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn btn-outline" id="btn-open-booking">開放預約</button>
        <button type="button" class="btn btn-gold" id="btn-publish">分享空檔</button>
      </div>
    </div>

    <!-- 班別模板 -->
    <section class="card" style="margin-bottom: 20px;">
      <div class="card-title-row">
        <h3>班別模板</h3>
        <span class="form-hint">點模板卡片後再點日曆上的日期，即可排入該天</span>
      </div>
      <div id="tpl-row" style="display:flex; gap:10px; overflow-x:auto; padding-bottom:4px;">
        <p class="empty-hint">載入中…</p>
      </div>
      <div id="pickbar" class="hidden" style="display:flex; align-items:center; gap:10px; background:var(--navy); color:#fff; border-radius:9px; padding:9px 13px; margin-top:12px; font-size:13px;">
        正在排入 <b id="pickbar-name"></b>　點日曆上的日期即可排入
        <button type="button" id="pickbar-cancel" style="margin-left:auto; background:rgba(255,255,255,.16); border:0; color:#fff; border-radius:7px; padding:5px 10px; font-size:12px; cursor:pointer;">取消</button>
      </div>
    </section>

    <div class="card-grid calendar-split">
      <div>
        <!-- 行事曆 -->
        <section class="card" style="margin-bottom: 20px;">
          <div class="card-title-row">
            <h3 id="cal-label">行事曆</h3>
            <div class="page-actions">
              <div class="type-toggle" style="width:140px;">
                <button type="button" id="view-month" class="active">月</button>
                <button type="button" id="view-week">週</button>
              </div>
              <button class="btn btn-outline" id="cal-prev">‹ 上頁</button>
              <button class="btn btn-outline" id="cal-today">今天</button>
              <button class="btn btn-outline" id="cal-next">下頁 ›</button>
            </div>
          </div>
          <div id="cal-body"><p class="empty-hint">載入中…</p></div>
        </section>

        <!-- 空檔推算規則 -->
        <section class="card">
          <div class="card-title-row">
            <h3>空檔推算規則</h3>
            <span class="form-hint">修改後即時重算右側空檔</span>
          </div>
          <div class="form-grid" id="config-form">
            <div class="form-field"><label>每日開始</label><input type="time" id="cfg-dayStart"></div>
            <div class="form-field"><label>每日結束</label><input type="time" id="cfg-dayEnd"></div>
            <div class="form-field"><label>班前緩衝（分）</label><input type="number" id="cfg-bufferBefore" min="0" step="15"></div>
            <div class="form-field"><label>班後緩衝（分）</label><input type="number" id="cfg-bufferAfter" min="0" step="15"></div>
            <div class="form-field">
              <label>最短可用空檔</label>
              <select id="cfg-minSlot">
                <option value="30">30 分</option><option value="60">1 小時</option>
                <option value="90">1.5 小時</option><option value="120">2 小時</option>
                <option value="180">3 小時</option>
              </select>
            </div>
            <div class="form-field">
              <label>時間對齊</label>
              <select id="cfg-roundTo">
                <option value="15">15 分</option><option value="30">30 分</option><option value="60">整點</option>
              </select>
            </div>
            <div class="form-field">
              <label>公布天數</label>
              <input type="number" id="cfg-publishDays" min="1" step="1">
            </div>
            <div class="form-field span-2">
              <label>預約連結（留空則公布訊息不附連結）</label>
              <input type="text" id="cfg-bookingUrl" placeholder="https://…">
            </div>
          </div>
          <p class="message" id="config-message"></p>
        </section>
      </div>

      <!-- 右欄：當日詳情 -->
      <section class="card" id="day-panel">
        <p class="empty-hint">點選左側日期查看當天內容</p>
      </section>
    </div>
  </main>
</div>

<!-- 新增班別模板 -->
<div class="modal-overlay hidden" id="tpl-overlay">
  <div class="modal-box">
    <h2>新增班別模板</h2>
    <div class="form-grid">
      <div class="form-field span-2"><label>名稱</label><input type="text" id="tpl-name" placeholder="例如：早班"></div>
      <div class="form-field"><label>模板編號</label><input type="text" id="tpl-code" placeholder="例如：S-0001"></div>
      <div class="form-field"><label>排序</label><input type="number" id="tpl-order" value="0" step="1"></div>
      <div class="form-field"><label>開始時間</label><input type="time" id="tpl-start" value="09:00"></div>
      <div class="form-field"><label>結束時間</label><input type="time" id="tpl-end" value="18:00"></div>
      <div class="form-field span-2">
        <label>顏色</label>
        <div id="tpl-swatches" style="display:flex; gap:8px;"></div>
      </div>
    </div>
    <p class="message" id="tpl-message"></p>
    <div class="page-actions" style="margin-top:16px; justify-content:flex-end;">
      <button type="button" class="btn btn-outline" id="tpl-cancel">取消</button>
      <button type="button" class="btn btn-primary" id="tpl-save">儲存模板</button>
    </div>
  </div>
</div>

<!-- 重複排班 -->
<div class="modal-overlay hidden" id="rep-overlay">
  <div class="modal-box">
    <h2 id="rep-title">重複排班</h2>
    <p class="subtitle" id="rep-subtitle" style="margin-top:-8px;"></p>
    <div class="form-field" style="margin-bottom:12px;">
      <label>每週哪幾天</label>
      <div id="rep-dow" style="display:flex; gap:6px;"></div>
    </div>
    <div class="form-grid">
      <div class="form-field"><label>從</label><input type="date" id="rep-from"></div>
      <div class="form-field"><label>到</label><input type="date" id="rep-to"></div>
      <div class="form-field span-2">
        <label>間隔</label>
        <select id="rep-interval"><option value="1">每週</option><option value="2">隔週</option></select>
      </div>
    </div>
    <p class="form-hint" id="rep-count" style="margin-top:10px;">選好星期後顯示筆數</p>
    <p class="message" id="rep-message"></p>
    <div class="page-actions" style="margin-top:16px; justify-content:flex-end;">
      <button type="button" class="btn btn-outline" id="rep-cancel">取消</button>
      <button type="button" class="btn btn-primary" id="rep-save">建立排班</button>
    </div>
  </div>
</div>

<!-- 公布空檔 -->
<div class="modal-overlay hidden" id="pub-overlay">
  <div class="modal-box">
    <h2>公布預覽</h2>
    <p class="subtitle" style="margin-top:-8px;">送到 LINE 的內容，未來 <span id="pub-days"></span> 天內的空檔</p>
    <pre id="pub-text" style="white-space:pre-wrap; background:var(--bg); border-radius:10px; padding:14px; font-size:13px; line-height:1.7; max-height:360px; overflow-y:auto;">載入中…</pre>
    <p class="message" id="pub-message"></p>
    <div class="page-actions" style="margin-top:16px; justify-content:flex-end;">
      <button type="button" class="btn btn-outline" id="pub-cancel">再改一下</button>
      <button type="button" class="btn btn-primary" id="pub-send">送出</button>
    </div>
  </div>
</div>

<style>
  .hidden { display: none !important; }
  .tpl-card { flex: 0 0 auto; min-width: 150px; text-align: left; background: #fff; border: 1.5px solid var(--border); border-radius: 11px; padding: 10px 12px; cursor: pointer; font-family: inherit; }
  .tpl-card:hover { border-color: var(--navy); }
  .tpl-card.picked { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(11,61,92,.12); }
  .tpl-card .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; margin-right: 6px; }
  .tpl-card .nm { font-size: 13px; font-weight: 700; }
  .tpl-card .tm { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
  .tpl-card .rep-chip { display: inline-block; margin-top: 8px; font-size: 10.5px; font-weight: 700; color: var(--navy); background: var(--bg); border-radius: 6px; padding: 3px 8px; }
  .tpl-card .rep-chip:hover { background: var(--navy); color: #fff; }
  .tpl-add { flex: 0 0 auto; min-width: 54px; display: flex; align-items: center; justify-content: center; border: 1.5px dashed var(--border); border-radius: 11px; font-size: 20px; color: var(--text-muted); background: #fff; cursor: pointer; }
  .swatch { width: 28px; height: 28px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
  .swatch.picked { border-color: var(--navy); }
  .dow-btn { width: 36px; height: 36px; border-radius: 9px; border: 1.5px solid var(--border); background: #fff; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--text-muted); }
  .dow-btn.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .month-cell { min-height: 90px; border: 1px solid var(--border); border-radius: 9px; padding: 6px 7px; cursor: pointer; background: #fff; }
  .month-cell:hover { border-color: var(--navy); }
  .month-cell.pad { background: #FAFCFD; border-color: var(--line-2, var(--border)); cursor: default; }
  .month-cell.selected { border-color: var(--navy); background: #E4EEF7; box-shadow: inset 0 0 0 1px var(--navy); }
  .month-cell .d-num { font-size: 13px; font-weight: 700; }
  .month-bar { margin-top: 4px; height: 16px; border-radius: 4px; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; overflow: hidden; white-space: nowrap; }
  .week-cols { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 8px; }
  .week-col { border: 1px solid var(--border); border-radius: 10px; padding: 8px; min-height: 160px; background: #fff; cursor: pointer; }
  .week-col:hover { border-color: var(--navy); }
  .week-col.selected { border-color: var(--navy); background: #E4EEF7; }
  .week-col .wc-head { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .week-entry { border-left: 3px solid #999; padding: 3px 6px; border-radius: 4px; background: var(--bg); font-size: 11.5px; margin-bottom: 4px; }
  .week-free { font-size: 10.5px; color: var(--success); font-weight: 700; margin-top: 6px; }
  .free-slot-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .entry-row { border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; margin-bottom: 8px; }
  .entry-row .entry-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .entry-row .entry-title { font-weight: 700; font-size: 13px; }
  .entry-row .entry-time { font-size: 12px; color: var(--text-muted); }
  .entry-row .entry-acts { display: flex; gap: 6px; margin-top: 6px; }

  .calendar-split { grid-template-columns: 2fr 1fr; }
  @media (max-width: 900px) {
    .calendar-split { grid-template-columns: 1fr; }
  }
  @media (max-width: 700px) {
    #cal-body { overflow-x: auto; }
    .month-grid, .week-cols { min-width: 600px; }
    .month-cell { min-height: 64px; }
  }
</style>

<script src="/desktop/common.js"></script>
<script src="/desktop/nav.js" data-active="calendar"></script>
<script>
(function () {
  var C = window.DesktopCommon;
  var COLORS = ["#3D6FD1", "#E07A28", "#7C56C9", "#C2415B", "#0E8A8A", "#5A6570"];
  var WD = ["日", "一", "二", "三", "四", "五", "六"];

  var templates = [];
  var config = null;
  var view = "month";
  var calendarMonth = C.currentMonth();
  var weekStart = startOfWeek(C.todayISO());
  var selectedDate = C.todayISO();
  var pickedTemplate = null;
  var visibleEntries = []; // 目前檢視範圍（月／週）內的排班行程，供月曆/週檢視與右側面板共用
  var tplColor = COLORS[0];

  // ── 日期工具（跟 rosterSchedule.ts 的 previousDate 同一套「純日曆天數加法」邏輯，
  // 只是搬到前端；不牽涉時區換算，輸入輸出都只是 yyyy-MM-dd 字串） ──
  function addDays(ymd, n) {
    var parts = ymd.split("-").map(Number);
    var dt = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
    dt.setUTCDate(dt.getUTCDate() + n);
    return dt.getUTCFullYear() + "-" + String(dt.getUTCMonth() + 1).padStart(2, "0") + "-" + String(dt.getUTCDate()).padStart(2, "0");
  }
  function weekdayOf(ymd) {
    var parts = ymd.split("-").map(Number);
    return new Date(Date.UTC(parts[0], parts[1] - 1, parts[2])).getUTCDay();
  }
  function startOfWeek(ymd) {
    return addDays(ymd, -weekdayOf(ymd));
  }
  function toMinutes(hm) {
    var parts = (hm || "00:00").split(":").map(Number);
    return (parts[0] || 0) * 60 + (parts[1] || 0);
  }
  function formatDuration(mins) {
    var h = Math.floor(mins / 60), m = mins % 60;
    if (h === 0) return m + "分";
    if (m === 0) return h + "小時";
    return h + "小時" + m + "分";
  }

  // ── 班別模板 ──
  async function loadTemplates() {
    templates = await C.apiFetch("/api/roster/templates");
    renderTemplates();
  }

  function renderTemplates() {
    var row = document.getElementById("tpl-row");
    if (templates.length === 0) {
      row.innerHTML = '<p class="empty-hint">還沒有班別模板</p>';
    } else {
      row.innerHTML = templates.map(function (t) {
        var picked = pickedTemplate && pickedTemplate.id === t.id ? " picked" : "";
        return '<button type="button" class="tpl-card' + picked + '" data-id="' + t.id + '">' +
          '<span class="dot" style="background:' + C.escapeHtml(t.color) + '"></span>' +
          '<span class="nm">' + C.escapeHtml(t.name) + '</span>' +
          '<div class="tm">' + C.escapeHtml(t.start) + ' – ' + C.escapeHtml(t.end) + '</div>' +
          '<span class="rep-chip" data-rep-id="' + t.id + '">重複排班</span>' +
          '</button>';
      }).join("");
    }
    row.innerHTML += '<button type="button" class="tpl-add" id="tpl-add-btn">＋</button>';

    row.querySelectorAll(".tpl-card").forEach(function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.hasAttribute("data-rep-id")) return;
        var id = Number(el.dataset.id);
        var t = templates.find(function (x) { return x.id === id; });
        if (!t) return;
        pickedTemplate = pickedTemplate && pickedTemplate.id === id ? null : t;
        renderTemplates();
        renderPickbar();
      });
    });
    row.querySelectorAll("[data-rep-id]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        var t = templates.find(function (x) { return x.id === Number(el.dataset.repId); });
        if (t) openRepeatModal(t);
      });
    });
    document.getElementById("tpl-add-btn").addEventListener("click", openTemplateModal);
  }

  function renderPickbar() {
    var bar = document.getElementById("pickbar");
    if (!pickedTemplate) { bar.classList.add("hidden"); return; }
    bar.classList.remove("hidden");
    document.getElementById("pickbar-name").textContent = pickedTemplate.name;
  }
  document.getElementById("pickbar-cancel").addEventListener("click", function () {
    pickedTemplate = null;
    renderTemplates();
    renderPickbar();
  });

  // ── 新增模板 ──
  function drawSwatches() {
    var wrap = document.getElementById("tpl-swatches");
    wrap.innerHTML = COLORS.map(function (c) {
      return '<button type="button" class="swatch' + (c === tplColor ? " picked" : "") + '" data-c="' + c + '" style="background:' + c + '"></button>';
    }).join("");
    wrap.querySelectorAll(".swatch").forEach(function (el) {
      el.addEventListener("click", function () { tplColor = el.dataset.c; drawSwatches(); });
    });
  }
  function openTemplateModal() {
    document.getElementById("tpl-name").value = "";
    document.getElementById("tpl-code").value = "";
    document.getElementById("tpl-order").value = String(templates.length);
    document.getElementById("tpl-start").value = "09:00";
    document.getElementById("tpl-end").value = "18:00";
    tplColor = COLORS[templates.length % COLORS.length];
    drawSwatches();
    C.showMessage(document.getElementById("tpl-message"), "");
    document.getElementById("tpl-overlay").classList.remove("hidden");
  }
  document.getElementById("tpl-cancel").addEventListener("click", function () {
    document.getElementById("tpl-overlay").classList.add("hidden");
  });
  document.getElementById("tpl-save").addEventListener("click", async function () {
    var msg = document.getElementById("tpl-message");
    var name = document.getElementById("tpl-name").value.trim();
    var code = document.getElementById("tpl-code").value.trim();
    var start = document.getElementById("tpl-start").value;
    var end = document.getElementById("tpl-end").value;
    var order = Number(document.getElementById("tpl-order").value);
    if (!name) { C.showMessage(msg, "請輸入名稱", "error"); return; }
    if (!code) { C.showMessage(msg, "請輸入模板編號", "error"); return; }
    var btn = document.getElementById("tpl-save");
    btn.disabled = true;
    C.showMessage(msg, "儲存中…");
    try {
      await C.apiFetch("/api/roster/templates", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: code, name: name, start: start, end: end, color: tplColor, order: order, active: true }),
      });
      document.getElementById("tpl-overlay").classList.add("hidden");
      await loadTemplates();
    } catch (err) {
      C.showMessage(msg, err.message || "儲存失敗", "error");
    } finally {
      btn.disabled = false;
    }
  });

  // ── 重複排班 ──
  var repDow = new Set();
  var repTemplate = null;
  function openRepeatModal(t) {
    repTemplate = t;
    repDow = new Set();
    document.getElementById("rep-title").textContent = "重複排班：" + t.name;
    document.getElementById("rep-subtitle").textContent = t.start + " – " + t.end;
    document.getElementById("rep-from").value = selectedDate;
    document.getElementById("rep-to").value = addDays(selectedDate, 27);
    document.getElementById("rep-interval").value = "1";
    drawDow();
    updateRepCount();
    C.showMessage(document.getElementById("rep-message"), "");
    document.getElementById("rep-overlay").classList.remove("hidden");
  }
  function drawDow() {
    var wrap = document.getElementById("rep-dow");
    wrap.innerHTML = WD.map(function (w, i) {
      return '<button type="button" class="dow-btn' + (repDow.has(i) ? " on" : "") + '" data-dow="' + i + '">' + w + '</button>';
    }).join("");
    wrap.querySelectorAll("[data-dow]").forEach(function (el) {
      el.addEventListener("click", function () {
        var d = Number(el.dataset.dow);
        if (repDow.has(d)) repDow.delete(d); else repDow.add(d);
        drawDow();
        updateRepCount();
      });
    });
  }
  function expandRepeatDates() {
    var from = document.getElementById("rep-from").value;
    var to = document.getElementById("rep-to").value;
    var every = Number(document.getElementById("rep-interval").value);
    if (!from || !to || repDow.size === 0) return [];
    var out = [];
    var cursor = from;
    var weekIndex = 0;
    var lastDow = -1;
    while (cursor <= to) {
      var dow = weekdayOf(cursor);
      if (dow === 0 && lastDow !== -1) weekIndex++;
      if (repDow.has(dow) && weekIndex % every === 0) out.push(cursor);
      lastDow = dow;
      cursor = addDays(cursor, 1);
    }
    return out;
  }
  function updateRepCount() {
    var el = document.getElementById("rep-count");
    if (repDow.size === 0) { el.textContent = "還沒選星期"; return; }
    var n = expandRepeatDates().length;
    el.textContent = "將建立 " + n + " 筆排班，同組會標上排班群組編號，可整組刪除。";
  }
  ["rep-from", "rep-to", "rep-interval"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", updateRepCount);
  });
  document.getElementById("rep-cancel").addEventListener("click", function () {
    document.getElementById("rep-overlay").classList.add("hidden");
  });
  document.getElementById("rep-save").addEventListener("click", async function () {
    var msg = document.getElementById("rep-message");
    var dates = expandRepeatDates();
    if (dates.length === 0) { C.showMessage(msg, "請先選星期", "error"); return; }
    var btn = document.getElementById("rep-save");
    btn.disabled = true;
    C.showMessage(msg, "建立中…");
    try {
      var result = await C.apiFetch("/api/roster/schedule/repeat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ templateCode: repTemplate.code, dates: dates }),
      });
      document.getElementById("rep-overlay").classList.add("hidden");
      C.showMessage(msg, "");
      await renderCalendar();
      await renderDayPanel();
      alert("已建立 " + result.succeeded + " / " + result.total + " 筆排班");
    } catch (err) {
      C.showMessage(msg, err.message || "建立失敗", "error");
    } finally {
      btn.disabled = false;
    }
  });

  // ── 月／週切換與行事曆渲染 ──
  document.getElementById("view-month").addEventListener("click", function () { setView("month"); });
  document.getElementById("view-week").addEventListener("click", function () { setView("week"); });
  function setView(v) {
    view = v;
    document.getElementById("view-month").classList.toggle("active", v === "month");
    document.getElementById("view-week").classList.toggle("active", v === "week");
    renderCalendar();
  }

  document.getElementById("cal-prev").addEventListener("click", function () {
    if (view === "month") calendarMonth = C.addMonths(calendarMonth, -1);
    else weekStart = addDays(weekStart, -7);
    renderCalendar();
  });
  document.getElementById("cal-next").addEventListener("click", function () {
    if (view === "month") calendarMonth = C.addMonths(calendarMonth, 1);
    else weekStart = addDays(weekStart, 7);
    renderCalendar();
  });
  document.getElementById("cal-today").addEventListener("click", function () {
    calendarMonth = C.currentMonth();
    weekStart = startOfWeek(C.todayISO());
    selectedDate = C.todayISO();
    renderCalendar();
    renderDayPanel();
  });

  function monthRange(month) {
    var year = Number(month.slice(0, 4)), mon = Number(month.slice(5, 7)) - 1;
    var first = new Date(Date.UTC(year, mon, 1));
    var daysInMonth = new Date(Date.UTC(year, mon + 1, 0)).getUTCDate();
    var from = month + "-01";
    var to = month + "-" + String(daysInMonth).padStart(2, "0");
    return { from: from, to: to, startWeekday: first.getUTCDay(), daysInMonth: daysInMonth };
  }

  async function renderCalendar() {
    var body = document.getElementById("cal-body");
    body.innerHTML = '<p class="empty-hint">載入中…</p>';
    try {
      if (view === "month") {
        document.getElementById("cal-label").textContent = calendarMonth;
        var range = monthRange(calendarMonth);
        visibleEntries = await C.apiFetch("/api/roster/schedule?from=" + range.from + "&to=" + range.to);
        renderMonthGrid(range);
      } else {
        var weekEnd = addDays(weekStart, 6);
        document.getElementById("cal-label").textContent = weekStart + " ～ " + weekEnd;
        visibleEntries = await C.apiFetch("/api/roster/schedule?from=" + weekStart + "&to=" + weekEnd);
        await renderWeekGrid();
      }
    } catch (err) {
      body.innerHTML = '<p class="empty-hint">無法載入（' + C.escapeHtml(err.message) + '）</p>';
    }
  }

  function entriesOf(date) {
    return visibleEntries.filter(function (e) { return e.date === date; }).sort(function (a, b) { return a.start.localeCompare(b.start); });
  }

  function renderMonthGrid(range) {
    var body = document.getElementById("cal-body");
    var html = '<div class="month-grid">';
    WD.forEach(function (w) { html += '<div style="text-align:center;font-size:12px;color:var(--text-muted);padding-bottom:4px;">' + w + '</div>'; });
    for (var i = 0; i < range.startWeekday; i++) html += '<div class="month-cell pad"></div>';
    for (var d = 1; d <= range.daysInMonth; d++) {
      var date = calendarMonth + "-" + String(d).padStart(2, "0");
      var entries = entriesOf(date);
      var cls = "month-cell" + (date === selectedDate ? " selected" : "");
      html += '<div class="' + cls + '" data-date="' + date + '"><div class="d-num">' + d + '</div>';
      entries.slice(0, 3).forEach(function (e) {
        var bg = e.status === "取消" ? "#B7C2CC" : (e.color || "#5A6570");
        html += '<div class="month-bar" style="background:' + C.escapeHtml(bg) + '">' + C.escapeHtml(e.title) + '</div>';
      });
      if (entries.length > 3) html += '<div class="form-hint">+' + (entries.length - 3) + ' 筆</div>';
      html += '</div>';
    }
    html += '</div>';
    body.innerHTML = html;
    body.querySelectorAll(".month-cell[data-date]").forEach(function (el) {
      el.addEventListener("click", function () { onDateClick(el.dataset.date); });
    });
  }

  async function renderWeekGrid() {
    var body = document.getElementById("cal-body");
    var dates = [];
    for (var i = 0; i < 7; i++) dates.push(addDays(weekStart, i));

    var freeByDate = {};
    await Promise.all(dates.map(function (date) {
      return C.apiFetch("/api/roster/free-slots?date=" + date).then(function (r) { freeByDate[date] = r.slots; }).catch(function () { freeByDate[date] = []; });
    }));

    var html = '<div class="week-cols">';
    dates.forEach(function (date) {
      var entries = entriesOf(date);
      var cls = "week-col" + (date === selectedDate ? " selected" : "");
      html += '<div class="' + cls + '" data-date="' + date + '">';
      html += '<div class="wc-head">' + date.slice(5).replace("-", "/") + '（' + WD[weekdayOf(date)] + '）</div>';
      if (entries.length === 0) html += '<p class="form-hint">無行程</p>';
      entries.forEach(function (e) {
        var border = e.status === "取消" ? "#B7C2CC" : (e.color || "#5A6570");
        html += '<div class="week-entry" style="border-left-color:' + C.escapeHtml(border) + '">' +
          C.escapeHtml(e.start) + '–' + C.escapeHtml(e.end) + ' ' + C.escapeHtml(e.title) +
          (e.status === "取消" ? '（已取消）' : '') + '</div>';
      });
      var free = freeByDate[date] || [];
      if (free.length) {
        html += '<div class="week-free">空檔 ' + free.length + ' 段</div>';
        free.forEach(function (s) {
          html += '<div class="form-hint">' + C.escapeHtml(s.start) + '–' + C.escapeHtml(s.end) + '</div>';
        });
      } else {
        html += '<div class="week-free" style="color:var(--text-muted);">無空檔</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    body.innerHTML = html;
    body.querySelectorAll(".week-col[data-date]").forEach(function (el) {
      el.addEventListener("click", function () { onDateClick(el.dataset.date); });
    });
  }

  async function onDateClick(date) {
    if (pickedTemplate) {
      try {
        await C.apiFetch("/api/roster/schedule", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ date: date, templateCode: pickedTemplate.code }),
        });
      } catch (err) {
        alert(err.message || "排入失敗");
      }
      pickedTemplate = null;
      renderTemplates();
      renderPickbar();
    }
    selectedDate = date;
    await renderCalendar();
    await renderDayPanel();
  }

  // ── 右側：當日詳情（行程清單、快速新增個人行程、空檔清單） ──
  async function renderDayPanel() {
    var panel = document.getElementById("day-panel");
    panel.innerHTML = '<p class="empty-hint">載入中…</p>';
    try {
      var entries = await C.apiFetch("/api/roster/schedule?date=" + selectedDate);
      var freeResult = await C.apiFetch("/api/roster/free-slots?date=" + selectedDate);

      var html = '<h3>' + selectedDate.slice(5).replace("-", "/") + '（' + WD[weekdayOf(selectedDate)] + '）</h3>';

      html += '<p class="section-label">行程</p>';
      if (entries.length === 0) {
        html += '<p class="empty-hint">這天沒有行程</p>';
      } else {
        entries.sort(function (a, b) { return a.start.localeCompare(b.start); }).forEach(function (e) {
          html += '<div class="entry-row" data-id="' + e.id + '">' +
            '<div class="entry-top"><span class="entry-title">' + C.escapeHtml(e.title) + '</span>' +
            '<span class="badge ' + (e.status === "取消" ? "badge-danger" : "badge-teal") + '">' + C.escapeHtml(e.status) + '</span></div>' +
            '<div class="entry-time">' + (e.allDay ? "全天" : C.escapeHtml(e.start) + ' – ' + C.escapeHtml(e.end)) + '</div>' +
            '<div class="entry-acts">' +
            '<button type="button" class="btn btn-outline" data-toggle="' + e.id + '" data-status="' + C.escapeHtml(e.status) + '" style="padding:4px 10px;font-size:12px;">' + (e.status === "取消" ? "恢復" : "取消") + '</button>' +
            '<button type="button" class="btn btn-danger" data-del="' + e.id + '" style="padding:4px 10px;font-size:12px;">刪除</button>' +
            (e.batchId ? '<button type="button" class="btn btn-danger" data-del-batch="' + C.escapeHtml(e.batchId) + '" style="padding:4px 10px;font-size:12px;">整組刪除</button>' : '') +
            '</div></div>';
        });
      }

      html += '<p class="section-label">空檔（依目前緩衝／最短空檔規則推算）</p>';
      if (freeResult.slots.length === 0) {
        html += '<p class="empty-hint">這天沒有空檔</p>';
      } else {
        freeResult.slots.forEach(function (s) {
          html += '<div class="free-slot-row"><span class="badge badge-gold">' + C.escapeHtml(s.start) + ' – ' + C.escapeHtml(s.end) + '</span>' +
            '<span class="form-hint">' + formatDuration(toMinutes(s.end) - toMinutes(s.start)) + '</span></div>';
        });
      }

      html += '<div style="margin-top:16px; border-top:1px solid var(--border); padding-top:14px;">' +
        '<p class="section-label">新增個人行程</p>' +
        '<div class="form-grid">' +
        '<div class="form-field span-2"><label>標題</label><input type="text" id="quick-title"></div>' +
        '<div class="form-field"><label>開始</label><input type="time" id="quick-start" value="09:00"></div>' +
        '<div class="form-field"><label>結束</label><input type="time" id="quick-end" value="10:00"></div>' +
        '</div>' +
        '<button type="button" class="btn btn-primary" id="quick-add" style="margin-top:12px; width:100%;">新增</button>' +
        '<p class="message" id="quick-message"></p></div>';

      panel.innerHTML = html;

      panel.querySelectorAll("[data-toggle]").forEach(function (el) {
        el.addEventListener("click", async function () {
          var next = el.dataset.status === "取消" ? "正常" : "取消";
          try {
            await C.apiFetch("/api/roster/schedule/" + el.dataset.toggle, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ status: next }),
            });
            await renderCalendar();
            await renderDayPanel();
          } catch (err) { alert(err.message || "更新失敗"); }
        });
      });
      panel.querySelectorAll("[data-del]").forEach(function (el) {
        el.addEventListener("click", async function () {
          if (!confirm("確定刪除這筆行程？")) return;
          try {
            await C.apiFetch("/api/roster/schedule/" + el.dataset.del, { method: "DELETE" });
            await renderCalendar();
            await renderDayPanel();
          } catch (err) { alert(err.message || "刪除失敗"); }
        });
      });
      panel.querySelectorAll("[data-del-batch]").forEach(function (el) {
        el.addEventListener("click", async function () {
          if (!confirm("確定刪除整組排班？此動作無法復原。")) return;
          try {
            await C.apiFetch("/api/roster/schedule/batch/" + encodeURIComponent(el.dataset.delBatch), { method: "DELETE" });
            await renderCalendar();
            await renderDayPanel();
          } catch (err) { alert(err.message || "刪除失敗"); }
        });
      });
      document.getElementById("quick-add").addEventListener("click", async function () {
        var msg = document.getElementById("quick-message");
        var title = document.getElementById("quick-title").value.trim();
        var start = document.getElementById("quick-start").value;
        var end = document.getElementById("quick-end").value;
        if (!title) { C.showMessage(msg, "請輸入標題", "error"); return; }
        try {
          await C.apiFetch("/api/roster/schedule", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ date: selectedDate, title: title, start: start, end: end }),
          });
          await renderCalendar();
          await renderDayPanel();
        } catch (err) { C.showMessage(msg, err.message || "新增失敗", "error"); }
      });
    } catch (err) {
      panel.innerHTML = '<p class="empty-hint">無法載入（' + C.escapeHtml(err.message) + '）</p>';
    }
  }

  // ── 空檔推算規則 ──
  async function loadConfig() {
    config = await C.apiFetch("/api/roster/config");
    document.getElementById("cfg-dayStart").value = config.dayStart;
    document.getElementById("cfg-dayEnd").value = config.dayEnd;
    document.getElementById("cfg-bufferBefore").value = config.bufferBefore;
    document.getElementById("cfg-bufferAfter").value = config.bufferAfter;
    document.getElementById("cfg-minSlot").value = String(config.minSlot);
    document.getElementById("cfg-roundTo").value = String(config.roundTo);
    document.getElementById("cfg-publishDays").value = config.publishDays;
    document.getElementById("cfg-bookingUrl").value = config.bookingUrl;
  }

  var configSaveTimer = null;
  function scheduleConfigSave() {
    if (configSaveTimer) clearTimeout(configSaveTimer);
    configSaveTimer = setTimeout(saveConfig, 500);
  }
  async function saveConfig() {
    var msg = document.getElementById("config-message");
    var body = {
      dayStart: document.getElementById("cfg-dayStart").value,
      dayEnd: document.getElementById("cfg-dayEnd").value,
      bufferBefore: Number(document.getElementById("cfg-bufferBefore").value),
      bufferAfter: Number(document.getElementById("cfg-bufferAfter").value),
      minSlot: Number(document.getElementById("cfg-minSlot").value),
      roundTo: Number(document.getElementById("cfg-roundTo").value),
      publishDays: Number(document.getElementById("cfg-publishDays").value),
      bookingUrl: document.getElementById("cfg-bookingUrl").value,
    };
    C.showMessage(msg, "儲存中…");
    try {
      await C.apiFetch("/api/roster/config", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      config = Object.assign({}, config, body);
      C.showMessage(msg, "已儲存", "success");
      await renderDayPanel();
      if (view === "week") await renderCalendar();
    } catch (err) {
      C.showMessage(msg, err.message || "儲存失敗", "error");
    }
  }
  ["cfg-dayStart", "cfg-dayEnd", "cfg-bufferBefore", "cfg-bufferAfter", "cfg-minSlot", "cfg-roundTo", "cfg-publishDays", "cfg-bookingUrl"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", scheduleConfigSave);
  });

  // ── 開放預約：直接開啟設定裡的預約連結，不動舊版 book.html／share.html ──
  document.getElementById("btn-open-booking").addEventListener("click", function () {
    if (config && config.bookingUrl) {
      window.open(config.bookingUrl, "_blank", "noopener");
    } else {
      alert("尚未設定預約連結，請先在下方「空檔推算規則」填入預約連結。");
    }
  });

  // ── 分享空檔：走既有 LINE 推播管道，不在 Ragic 留任何紀錄 ──
  document.getElementById("btn-publish").addEventListener("click", async function () {
    var overlay = document.getElementById("pub-overlay");
    var pre = document.getElementById("pub-text");
    var msg = document.getElementById("pub-message");
    document.getElementById("pub-days").textContent = config ? config.publishDays : "";
    pre.textContent = "載入中…";
    C.showMessage(msg, "");
    overlay.classList.remove("hidden");
    try {
      var result = await C.apiFetch("/api/roster/publish?dryRun=1", { method: "POST" });
      pre.textContent = result.text;
    } catch (err) {
      pre.textContent = "";
      C.showMessage(msg, err.message || "預覽失敗", "error");
    }
  });
  document.getElementById("pub-cancel").addEventListener("click", function () {
    document.getElementById("pub-overlay").classList.add("hidden");
  });
  document.getElementById("pub-send").addEventListener("click", async function () {
    var msg = document.getElementById("pub-message");
    var btn = document.getElementById("pub-send");
    btn.disabled = true;
    C.showMessage(msg, "推播中…");
    try {
      await C.apiFetch("/api/roster/publish", { method: "POST" });
      document.getElementById("pub-overlay").classList.add("hidden");
    } catch (err) {
      C.showMessage(msg, err.message || "推播失敗", "error");
    } finally {
      btn.disabled = false;
    }
  });

  (async function init() {
    // 待辦頁「檢視」排班行程會導來 ?date=yyyy-MM-dd，定位到那一天（見 desktop/tasks.html）。
    var dateParam = new URLSearchParams(location.search).get("date");
    if (dateParam && /^\d{4}-\d{2}-\d{2}$/.test(dateParam)) {
      selectedDate = dateParam;
      calendarMonth = dateParam.slice(0, 7);
      weekStart = startOfWeek(dateParam);
    }
    await Promise.all([loadTemplates(), loadConfig()]);
    await renderCalendar();
    await renderDayPanel();
  })();
})();
</script>
</body>
</html>
