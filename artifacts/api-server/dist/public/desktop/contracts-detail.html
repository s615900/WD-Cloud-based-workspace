<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合約詳情 - 個人工作台</title>
<meta name="theme-color" content="#0B3D5C">
<link rel="stylesheet" href="/desktop/desktop.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-root"></aside>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 id="page-title">合約詳情</h1>
        <p class="subtitle" id="page-subtitle"></p>
      </div>
      <div class="page-actions">
        <a class="btn btn-outline" href="/desktop/contracts.html">‹ 返回列表</a>
        <a class="btn btn-gold" id="edit-link" href="#">編輯這筆合約</a>
      </div>
    </div>

    <div id="detail-body">
      <p class="empty-hint">載入中…</p>
    </div>
  </main>
</div>

<style>
  .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 24px; }
  .detail-row { display: flex; flex-direction: column; gap: 2px; }
  .detail-row .label { font-size: 12px; color: var(--text-muted); }
  .detail-row .value { font-size: 14px; }
  .canvas-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  @media (max-width: 640px) {
    .detail-grid { grid-template-columns: 1fr; }
  }
</style>

<script src="/desktop/common.js"></script>
<script src="/desktop/nav.js" data-active="contracts"></script>
<script>
(function () {
  var C = window.DesktopCommon;
  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");
  var STATUSES = ["草稿", "已發送", "已簽約", "已結案", "作廢"];

  function formatCurrency(n) {
    var rounded = Math.round((Number(n) || 0) * 100) / 100;
    return "$" + rounded.toLocaleString("en-US");
  }

  function renderItemsTable(items) {
    if (!items || items.length === 0) {
      return '<p class="empty-hint">尚無品項</p>';
    }
    return '<table class="data-table"><thead><tr><th>項目名稱</th><th>單價</th><th>單位</th><th>數量</th><th>小計</th></tr></thead><tbody>' +
      items.map(function (item) {
        var subtotal = (parseFloat(item.price) || 0) * (parseFloat(item.qty) || 0);
        return '<tr>' +
          '<td>' + C.escapeHtml(item.name) + '</td>' +
          '<td>' + C.escapeHtml(item.price) + '</td>' +
          '<td>' + C.escapeHtml(item.unit) + '</td>' +
          '<td>' + C.escapeHtml(item.qty) + '</td>' +
          '<td>' + formatCurrency(subtotal) + '</td>' +
          '</tr>';
      }).join("") + '</tbody></table>';
  }

  async function load() {
    var body = document.getElementById("detail-body");
    if (!id) {
      body.innerHTML = '<p class="empty-hint">缺少合約編號</p>';
      return;
    }
    document.getElementById("edit-link").href = "/desktop/contracts-new.html?id=" + id;

    try {
      var detail = await C.apiFetch("/api/contracts/" + id);
      document.getElementById("page-title").textContent = "合約 " + (detail.contractNumber || ("#" + detail.id)) + "　" + (detail.clientName || "");
      document.getElementById("page-subtitle").textContent = "報價單 " + (detail.quoteNumber || "—") + "　簽核狀態：" + (detail.signStatus || "未簽核");

      body.innerHTML =
        '<div class="card" style="margin-bottom:20px;">' +
          '<h3>客戶資訊</h3>' +
          '<div class="detail-grid">' +
            '<div class="detail-row"><span class="label">客戶名稱</span><span class="value">' + C.escapeHtml(detail.clientName || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">統一編號</span><span class="value">' + C.escapeHtml(detail.taxId || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">聯絡地址</span><span class="value">' + C.escapeHtml(detail.address || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">聯絡人</span><span class="value">' + C.escapeHtml(detail.contact || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">聯絡人電話</span><span class="value">' + C.escapeHtml(detail.contactPhone || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">Email</span><span class="value">' + C.escapeHtml(detail.email || "（未填）") + '</span></div>' +
          '</div>' +
        '</div>' +

        '<div class="card" style="margin-bottom:20px;">' +
          '<h3>合約資訊</h3>' +
          '<div class="detail-grid">' +
            '<div class="detail-row"><span class="label">關聯專案</span><span class="value">' + C.escapeHtml(detail.projectName || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">報價日期</span><span class="value">' + C.escapeHtml(detail.quoteDate || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">有效期限</span><span class="value">' + C.escapeHtml(detail.validUntil || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">合約金額</span><span class="value" style="font-weight:700;">' + formatCurrency(detail.amount) + '</span></div>' +
          '</div>' +
        '</div>' +

        '<div class="card" style="margin-bottom:20px;">' +
          '<h3>品項</h3>' +
          renderItemsTable(detail.items) +
        '</div>' +

        (detail.nda ? '<div class="card" style="margin-bottom:20px;"><h3>保密條款內容（NDA）</h3><div class="rich-display">' + detail.nda + '</div></div>' : "") +

        (detail.note ? '<div class="card" style="margin-bottom:20px;"><h3>備註</h3><div class="rich-display">' + detail.note + '</div></div>' : "") +

        '<div class="card" style="margin-bottom:20px;">' +
          '<h3>客戶簽署</h3>' +
          (detail.customerSignedAt ?
            '<div class="detail-grid">' +
              '<div class="detail-row"><span class="label">簽署人</span><span class="value">' + C.escapeHtml(detail.customerSignerName || "（未填）") + '</span></div>' +
              '<div class="detail-row"><span class="label">簽署時間</span><span class="value">' + C.escapeHtml(detail.customerSignedAt) + '</span></div>' +
            '</div>' :
            '<p class="form-hint">尚未完成客戶簽署</p>' +
            '<button type="button" class="btn btn-outline" id="gen-sign-link-btn" style="margin-top:10px;">產生簽署連結</button>'
          ) +
        '</div>' +

        '<div class="card" style="margin-bottom:20px;" id="staff-sign-card">' +
          '<h3>負責人簽署</h3>' +
          (detail.staffSignedAt ?
            '<div class="detail-grid">' +
              '<div class="detail-row"><span class="label">簽署人</span><span class="value">' + C.escapeHtml(detail.staffSignerEmail || "（未填）") + '</span></div>' +
              '<div class="detail-row"><span class="label">簽署時間</span><span class="value">' + C.escapeHtml(detail.staffSignedAt) + '</span></div>' +
            '</div>' :
            '<div id="staff-sign-form">' +
              '<p class="form-hint" id="staff-signer-hint">載入負責人資料中…</p>' +
              '<canvas class="sign-pad-canvas" id="staff-sign-canvas"></canvas>' +
              '<div class="canvas-actions"><button type="button" class="btn btn-outline" id="staff-clear-btn">清除重簽</button></div>' +
              '<button type="button" class="btn btn-gold" id="staff-submit-btn" style="margin-top:12px;">確認簽署</button>' +
              '<p class="message" id="staff-sign-message"></p>' +
            '</div>'
          ) +
        '</div>' +

        '<div class="card">' +
          '<h3>合約狀態</h3>' +
          '<div class="form-grid">' +
            '<div class="form-field">' +
              '<label>狀態</label>' +
              '<select id="f-status">' +
                STATUSES.map(function (s) {
                  return '<option value="' + s + '"' + (s === (detail.status || "草稿") ? ' selected' : '') + '>' + s + '</option>';
                }).join("") +
              '</select>' +
            '</div>' +
          '</div>' +
          '<button type="button" class="btn btn-gold" id="save-status-btn" style="margin-top:12px;">更新狀態</button>' +
          '<p class="message" id="status-message"></p>' +
        '</div>';

      var genLinkBtn = document.getElementById("gen-sign-link-btn");
      if (genLinkBtn) {
        genLinkBtn.addEventListener("click", async function () {
          genLinkBtn.disabled = true;
          try {
            var result = await C.apiFetch("/api/contracts/" + id + "/sign-link", { method: "POST" });
            var url = window.location.origin + "/contract-sign.html?token=" + result.token;
            window.prompt("請複製以下連結傳送給客戶（開啟連結免登入）：", url);
          } catch (err) {
            alert("產生連結失敗：" + err.message);
          } finally {
            genLinkBtn.disabled = false;
          }
        });
      }

      wireStaffSignature(detail);

      document.getElementById("save-status-btn").addEventListener("click", async function () {
        var msgEl = document.getElementById("status-message");
        var btn = document.getElementById("save-status-btn");
        btn.disabled = true;
        C.showMessage(msgEl, "更新中…");
        try {
          await C.apiFetch("/api/contracts/" + id, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: document.getElementById("f-status").value }),
          });
          C.showMessage(msgEl, "已更新狀態", "success");
        } catch (err) {
          C.showMessage(msgEl, err.message || "更新失敗", "error");
        } finally {
          btn.disabled = false;
        }
      });
    } catch (err) {
      body.innerHTML = '<p class="empty-hint">無法載入（' + C.escapeHtml(err.message) + '）</p>';
    }
  }

  // 負責人簽署直接在桌面版內畫簽名送出（負責人就是已登入的自己人，不用像客戶簽署
  // 那樣另外產生公開連結）。簽署人 email 是後端依環境變數 CONTRACT_STAFF_EMAIL 決定，
  // 這裡先載入顯示是哪個帳號，避免使用者不清楚簽下去會記錄成誰。
  function wireStaffSignature(detail) {
    if (detail.staffSignedAt) return;
    var canvas = document.getElementById("staff-sign-canvas");
    if (!canvas) return;
    var pad = C.mountSignaturePad(canvas);
    var hintEl = document.getElementById("staff-signer-hint");

    C.apiFetch("/api/contracts/staff-signer").then(function (result) {
      hintEl.textContent = "簽署人將記錄為：" + result.email;
    }).catch(function (err) {
      hintEl.textContent = "尚未設定負責人 email（" + err.message + "），無法送出簽署";
      document.getElementById("staff-submit-btn").disabled = true;
    });

    document.getElementById("staff-clear-btn").addEventListener("click", function () { pad.clear(); });

    document.getElementById("staff-submit-btn").addEventListener("click", async function () {
      var msgEl = document.getElementById("staff-sign-message");
      var btn = document.getElementById("staff-submit-btn");
      if (pad.isEmpty()) { C.showMessage(msgEl, "請先簽名", "error"); return; }
      btn.disabled = true;
      C.showMessage(msgEl, "送出中…");
      try {
        await C.apiFetch("/api/contracts/" + id + "/staff-signature", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ signatureImage: pad.toDataUrl() }),
        });
        C.showMessage(msgEl, "已完成簽署", "success");
        load();
      } catch (err) {
        C.showMessage(msgEl, err.message || "送出失敗", "error");
        btn.disabled = false;
      }
    });
  }

  load();
})();
</script>
</body>
</html>
