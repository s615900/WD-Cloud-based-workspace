<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新增合約 - 個人工作台</title>
<meta name="theme-color" content="#0B3D5C">
<link rel="stylesheet" href="/desktop/desktop.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-root"></aside>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 id="page-title">新增合約</h1>
        <p class="subtitle">合約金額直接沿用報價單當時算好的總金額（含稅），可手動調整，這裡不重算稅務</p>
      </div>
      <div class="page-actions">
        <a class="btn btn-outline" href="/desktop/contracts.html">‹ 返回列表</a>
      </div>
    </div>

    <form id="contract-form">
      <div class="card" style="margin-bottom: 20px;" id="quote-picker-card">
        <h3>對應報價單</h3>
        <div class="form-grid">
          <div class="form-field span-2">
            <label>選擇報價單<span class="required">*</span></label>
            <select id="f-quote"><option value="">載入中…</option></select>
            <p class="form-hint">格式：報價單編號 - 客戶名稱 - 總金額(含稅)</p>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 20px;">
        <h3>客戶資料</h3>
        <p class="form-hint" style="margin-bottom: 14px;">選定報價單後會立即帶入以下欄位，也可以在這裡覆蓋：</p>
        <div class="form-grid">
          <div class="form-field"><label>客戶名稱</label><input type="text" id="f-client-name" placeholder="自動帶入"></div>
          <div class="form-field"><label>統一編號</label><input type="text" id="f-tax-id" placeholder="自動帶入"></div>
          <div class="form-field"><label>聯絡人</label><input type="text" id="f-contact" placeholder="自動帶入"></div>
          <div class="form-field"><label>聯絡人電話</label><input type="text" id="f-contact-phone" placeholder="自動帶入"></div>
          <div class="form-field span-2"><label>聯絡地址</label><input type="text" id="f-address" placeholder="自動帶入"></div>
          <div class="form-field span-2"><label>Email</label><input type="text" id="f-email" placeholder="自動帶入"></div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 20px;">
        <h3>合約資訊</h3>
        <div class="form-grid">
          <div class="form-field"><label>關聯專案</label><input type="text" id="f-project-name" placeholder="自動帶入"></div>
          <div class="form-field"><label>報價日期</label><input type="date" id="f-date"></div>
          <div class="form-field"><label>有效期限</label><input type="date" id="f-valid-until"></div>
          <div class="form-field">
            <label>狀態</label>
            <select id="f-status">
              <option value="草稿">草稿</option>
              <option value="已發送">已發送</option>
              <option value="已簽約">已簽約</option>
              <option value="已結案">已結案</option>
              <option value="作廢">作廢</option>
            </select>
          </div>
          <div class="form-field">
            <label>合約金額<span class="required">*</span></label>
            <input type="text" id="f-amount" placeholder="自動帶入報價單總金額，可手動調整">
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 20px;">
        <div class="card-title-row">
          <h3>品項</h3>
          <button type="button" class="btn btn-outline" id="add-item-btn">+ 新增品項</button>
        </div>
        <div style="overflow-x: auto;">
          <table class="data-table">
            <thead><tr><th>項目名稱</th><th style="width:110px;">單價</th><th style="width:90px;">單位</th><th style="width:90px;">數量</th><th></th></tr></thead>
            <tbody id="items-body"><tr><td colspan="5" class="empty-hint">尚未加入品項</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="card" style="margin-bottom: 20px;">
        <h3>保密條款內容（NDA）</h3>
        <div id="nda-editor"></div>
      </div>

      <div class="card">
        <h3>備註</h3>
        <div id="note-editor"></div>
      </div>

      <div style="margin-top: 20px;">
        <button type="submit" class="btn btn-gold" id="save-btn">儲存合約</button>
        <p class="message" id="form-message"></p>
      </div>
    </form>
  </main>
</div>

<script src="/desktop/common.js"></script>
<script src="/desktop/nav.js" data-active="contracts"></script>
<script>
(function () {
  var C = window.DesktopCommon;
  var params = new URLSearchParams(window.location.search);
  var editId = params.get("id");
  var quotes = [];
  var quoteMap = {};
  var items = []; // { name, price, unit, qty }
  var ndaEditor = C.mountRichEditor(document.getElementById("nda-editor"), "");
  var noteEditor = C.mountRichEditor(document.getElementById("note-editor"), "");

  if (editId) {
    document.getElementById("page-title").textContent = "編輯合約";
    // 合約一旦建立，對應的報價單不能再換一張（客戶資訊、品項都已經是這筆合約自己的資料），
    // 編輯模式下把報價單選單整張卡片隱藏，避免使用者以為換選項就能改連結的報價單。
    document.getElementById("quote-picker-card").style.display = "none";
  } else {
    document.getElementById("f-date").value = C.todayISO();
  }

  function quoteOptionLabel(q) {
    return (q.quoteNumber || ("#" + q.id)) + " - " + (q.clientName || "") + " - " + (q.totalAmount || "");
  }

  async function loadQuotes() {
    var select = document.getElementById("f-quote");
    try {
      quotes = await C.apiFetch("/api/quotes");
      quoteMap = {};
      quotes.forEach(function (q) { quoteMap[q.id] = q; });
      select.innerHTML = '<option value="">請選擇報價單</option>' + quotes.map(function (q) {
        return '<option value="' + q.id + '">' + C.escapeHtml(quoteOptionLabel(q)) + '</option>';
      }).join("") || '<option value="">尚無報價單</option>';
    } catch (e) {
      quotes = [];
      select.innerHTML = '<option value="">載入失敗</option>';
    }
  }

  // 選定報價單後，Ragic 表單端的「同時載入其他欄位」不會因為 API POST 而觸發，
  // 所以這裡把客戶資訊、合約金額、關聯專案自己抓出來預填，使用者仍可以覆蓋。
  function applyQuoteSelection() {
    var quoteId = document.getElementById("f-quote").value;
    var quote = quoteMap[quoteId];
    document.getElementById("f-client-name").value = quote ? (quote.clientName || "") : "";
    document.getElementById("f-tax-id").value = quote ? (quote.taxId || "") : "";
    document.getElementById("f-contact").value = quote ? (quote.contact || "") : "";
    document.getElementById("f-contact-phone").value = quote ? (quote.contactPhone || "") : "";
    document.getElementById("f-address").value = quote ? (quote.address || "") : "";
    document.getElementById("f-email").value = quote ? (quote.email || "") : "";
    document.getElementById("f-project-name").value = quote ? (quote.projectName || "") : "";
    document.getElementById("f-date").value = quote ? (quote.quoteDate || "").replaceAll("/", "-") : "";
    document.getElementById("f-amount").value = quote ? (quote.totalAmount || "") : "";
  }

  document.getElementById("f-quote").addEventListener("change", applyQuoteSelection);

  async function loadExisting() {
    if (!editId) return;
    try {
      var detail = await C.apiFetch("/api/contracts/" + editId);
      document.getElementById("page-title").textContent = "編輯合約 " + (detail.contractNumber || ("#" + editId));
      document.getElementById("f-client-name").value = detail.clientName || "";
      document.getElementById("f-tax-id").value = detail.taxId || "";
      document.getElementById("f-contact").value = detail.contact || "";
      document.getElementById("f-contact-phone").value = detail.contactPhone || "";
      document.getElementById("f-address").value = detail.address || "";
      document.getElementById("f-email").value = detail.email || "";
      document.getElementById("f-project-name").value = detail.projectName || "";
      document.getElementById("f-date").value = (detail.quoteDate || "").replaceAll("/", "-");
      document.getElementById("f-valid-until").value = (detail.validUntil || "").replaceAll("/", "-");
      document.getElementById("f-status").value = detail.status || "草稿";
      document.getElementById("f-amount").value = detail.amount || "";
      ndaEditor.setHtml(detail.nda || "");
      noteEditor.setHtml(detail.note || "");
      items = (detail.items || []).map(function (item) {
        return { name: item.name, price: item.price, unit: item.unit, qty: item.qty };
      });
      renderItems();
    } catch (err) {
      C.showMessage(document.getElementById("form-message"), "載入既有合約失敗：" + err.message, "error");
    }
  }

  function renderItems() {
    var body = document.getElementById("items-body");
    if (items.length === 0) {
      body.innerHTML = '<tr><td colspan="5" class="empty-hint">尚未加入品項</td></tr>';
      return;
    }
    body.innerHTML = items.map(function (item, index) {
      return '<tr>' +
        '<td><input type="text" data-field="name" data-index="' + index + '" value="' + C.escapeHtml(item.name || "") + '"></td>' +
        '<td><input type="text" data-field="price" data-index="' + index + '" value="' + C.escapeHtml(item.price || "") + '"></td>' +
        '<td><input type="text" data-field="unit" data-index="' + index + '" value="' + C.escapeHtml(item.unit || "") + '"></td>' +
        '<td><input type="text" data-field="qty" data-index="' + index + '" value="' + C.escapeHtml(item.qty || "") + '"></td>' +
        '<td><button type="button" class="btn btn-danger" data-remove="' + index + '" style="padding:5px 10px;font-size:12px;">移除</button></td>' +
        '</tr>';
    }).join("");

    body.querySelectorAll("input[data-field]").forEach(function (input) {
      input.style.width = "100%";
      input.style.padding = "6px 8px";
      input.style.border = "1px solid var(--border)";
      input.style.borderRadius = "6px";
      input.addEventListener("input", function () {
        items[Number(input.dataset.index)][input.dataset.field] = input.value;
      });
    });
    body.querySelectorAll("button[data-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        items.splice(Number(btn.dataset.remove), 1);
        renderItems();
      });
    });
  }

  document.getElementById("add-item-btn").addEventListener("click", function () {
    items.push({ name: "", price: "", unit: "", qty: "1" });
    renderItems();
  });

  document.getElementById("contract-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    var messageEl = document.getElementById("form-message");

    function optional(id) {
      var v = document.getElementById(id).value.trim();
      return v === "" ? undefined : v;
    }

    var amount = document.getElementById("f-amount").value.trim();
    if (!amount) { C.showMessage(messageEl, "請填寫合約金額", "error"); return; }
    for (var i = 0; i < items.length; i++) {
      if (!items[i].name || !items[i].name.trim()) { C.showMessage(messageEl, "第 " + (i + 1) + " 項品項請填寫項目名稱", "error"); return; }
    }

    var payload = {
      quoteDate: document.getElementById("f-date").value || undefined,
      validUntil: optional("f-valid-until"),
      status: document.getElementById("f-status").value,
      amount: amount,
      nda: ndaEditor.getHtml(),
      note: noteEditor.getHtml(),
      clientName: optional("f-client-name"),
      taxId: optional("f-tax-id"),
      contact: optional("f-contact"),
      contactPhone: optional("f-contact-phone"),
      address: optional("f-address"),
      email: optional("f-email"),
      projectName: optional("f-project-name"),
      items: items.map(function (item) {
        return { name: item.name, price: item.price, unit: item.unit, qty: item.qty || "1" };
      }),
    };
    Object.keys(payload).forEach(function (k) { if (payload[k] === undefined) delete payload[k]; });

    var saveBtn = document.getElementById("save-btn");

    if (!editId) {
      var quoteId = document.getElementById("f-quote").value;
      var quote = quoteMap[quoteId];
      if (!quoteId || !quote) { C.showMessage(messageEl, "請選擇報價單", "error"); return; }
      payload.quoteId = quoteId;
      payload.quoteNumber = quote.quoteNumber || "";
      if (payload.clientName === undefined) payload.clientName = quote.clientName || "";
    }

    saveBtn.disabled = true;
    C.showMessage(messageEl, "儲存中…");
    try {
      var targetId = editId;
      if (editId) {
        await C.apiFetch("/api/contracts/" + editId, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      } else {
        var created = await C.apiFetch("/api/contracts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        targetId = created.id;
      }
      C.showMessage(messageEl, "已儲存，正在前往詳情頁…", "success");
      window.location.href = "/desktop/contracts-detail.html?id=" + targetId;
    } catch (err) {
      C.showMessage(messageEl, err.message || "儲存失敗", "error");
      saveBtn.disabled = false;
    }
  });

  loadQuotes().then(loadExisting);
})();
</script>
</body>
</html>
