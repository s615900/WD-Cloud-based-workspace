<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>報價單詳情 - 個人工作台</title>
<meta name="theme-color" content="#0B3D5C">
<link rel="stylesheet" href="/desktop/desktop.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-root"></aside>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 id="page-title">報價單詳情</h1>
        <p class="subtitle" id="page-subtitle"></p>
      </div>
      <div class="page-actions">
        <a class="btn btn-outline" href="/desktop/quotes.html">‹ 返回列表</a>
        <a class="btn btn-gold" id="edit-link" href="#">編輯這筆報價單</a>
      </div>
    </div>

    <div id="detail-body">
      <p class="empty-hint">載入中…</p>
    </div>
  </main>
</div>

<style>
  .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 24px; }
  .detail-row { display: flex; flex-direction: column; gap: 2px; }
  .detail-row .label { font-size: 12px; color: var(--text-muted); }
  .detail-row .value { font-size: 14px; }
  .calc-summary { display: flex; flex-direction: column; gap: 8px; max-width: 420px; }
  .calc-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .calc-row.calc-total { border-top: 2px solid var(--border); margin-top: 6px; padding-top: 10px; font-size: 18px; font-weight: 700; }
  @media (max-width: 640px) {
    .detail-grid { grid-template-columns: 1fr; }
  }
</style>

<script src="/desktop/common.js"></script>
<script src="/desktop/nav.js" data-active="quotes"></script>
<script>
(function () {
  var C = window.DesktopCommon;
  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");

  function formatCurrency(n) {
    var rounded = Math.round((Number(n) || 0) * 100) / 100;
    return "$" + rounded.toLocaleString("en-US");
  }

  // 這裡的金額一律用「品項＋折扣率＋稅率」在前端即時算出來顯示，不直接信任 Ragic 的
  // 未稅金額／稅額／總金額含稅這三個公式欄位——這幾個欄位是報價單存檔後 Ragic 端非同步
  // 算出來的，剛送出、Ragic 還沒算完的當下讀到的會是空字串，直接顯示會讓使用者以為
  // 金額不見了。前端自己算的邏輯跟送出報價單時換算給 Ragic 的邏輯完全對齊，不用等它。
  function calcAmounts(detail) {
    var subtotal = (detail.items || []).reduce(function (sum, item) {
      var price = parseFloat(item.price) || 0;
      var qty = parseFloat(item.qty) || 0;
      return sum + price * qty;
    }, 0);
    var discountMultiplier = parseFloat(detail.discountRate);
    if (!Number.isFinite(discountMultiplier)) discountMultiplier = 1;
    var taxRateMatch = String(detail.taxRate || "").match(/[\d.]+/);
    var taxRate = taxRateMatch ? parseFloat(taxRateMatch[0]) / 100 : 0.05;

    var afterDiscount = subtotal * discountMultiplier;
    var untaxed, tax, total;
    if (detail.taxMode === "稅內含") {
      untaxed = afterDiscount / (1 + taxRate);
      total = afterDiscount;
      tax = total - untaxed;
    } else {
      untaxed = afterDiscount;
      tax = untaxed * taxRate;
      total = untaxed + tax;
    }
    return { subtotal: subtotal, afterDiscount: afterDiscount, untaxed: untaxed, tax: tax, total: total, taxRate: taxRate };
  }

  var PAYMENT_STATUSES = ["未付款", "已付訂金", "部分付款", "已付款", "已取消"];

  function renderItemsTable(items) {
    if (!items || items.length === 0) {
      return '<p class="empty-hint">尚無品項</p>';
    }
    return '<table class="data-table"><thead><tr><th>品項</th><th>單價</th><th>單位</th><th>數量</th><th>小計</th><th>備註</th></tr></thead><tbody>' +
      items.map(function (item) {
        var subtotal = (parseFloat(item.price) || 0) * (parseFloat(item.qty) || 0);
        return '<tr>' +
          '<td>' + C.escapeHtml(item.name) + '</td>' +
          '<td>' + C.escapeHtml(item.price) + '</td>' +
          '<td>' + C.escapeHtml(item.unit) + '</td>' +
          '<td>' + C.escapeHtml(item.qty) + '</td>' +
          '<td>' + formatCurrency(subtotal) + '</td>' +
          '<td>' + C.escapeHtml(item.note || "") + '</td>' +
          '</tr>';
      }).join("") + '</tbody></table>';
  }

  async function load() {
    var body = document.getElementById("detail-body");
    if (!id) {
      body.innerHTML = '<p class="empty-hint">缺少報價單編號</p>';
      return;
    }
    document.getElementById("edit-link").href = "/desktop/quotes-new.html?id=" + id;

    try {
      var detail = await C.apiFetch("/api/quotes/" + id);
      document.getElementById("page-title").textContent = "報價單 " + (detail.quoteNumber || ("#" + detail.id)) + "　" + (detail.clientName || "");
      document.getElementById("page-subtitle").textContent = "報價日期 " + (detail.quoteDate || "（未填）");

      var calc = calcAmounts(detail);

      body.innerHTML =
        '<div class="card" style="margin-bottom:20px;">' +
          '<h3>客戶資訊</h3>' +
          '<div class="detail-grid">' +
            '<div class="detail-row"><span class="label">客戶名稱</span><span class="value">' + C.escapeHtml(detail.clientName || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">統一編號</span><span class="value">' + C.escapeHtml(detail.taxId || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">聯絡地址</span><span class="value">' + C.escapeHtml(detail.address || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">聯絡人</span><span class="value">' + C.escapeHtml(detail.contact || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">公司電話</span><span class="value">' + C.escapeHtml(detail.companyPhone || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">聯絡人電話</span><span class="value">' + C.escapeHtml(detail.contactPhone || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">電子郵件</span><span class="value">' + C.escapeHtml(detail.email || "（未填）") + '</span></div>' +
          '</div>' +
        '</div>' +

        '<div class="card" style="margin-bottom:20px;">' +
          '<h3>報價資訊</h3>' +
          '<div class="detail-grid">' +
            '<div class="detail-row"><span class="label">專案名稱</span><span class="value">' + C.escapeHtml(detail.projectName || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">報價日期</span><span class="value">' + C.escapeHtml(detail.quoteDate || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">報價有效期限</span><span class="value">' + C.escapeHtml(detail.validUntil || "（未填）") + '</span></div>' +
            '<div class="detail-row"><span class="label">課稅別</span><span class="value">' + C.escapeHtml(detail.taxType || "營業稅") + '</span></div>' +
            '<div class="detail-row"><span class="label">計稅方式</span><span class="value">' + C.escapeHtml(detail.taxMode || "稅外加") + '</span></div>' +
            '<div class="detail-row"><span class="label">稅率</span><span class="value">' + (calc.taxRate * 100) + '%</span></div>' +
            '<div class="detail-row"><span class="label">折扣率</span><span class="value">' + Math.round(parseFloat(detail.discountRate || "1") * 100) + '%</span></div>' +
          '</div>' +
          (detail.note ? '<div class="detail-row" style="margin-top:12px;"><span class="label">特別說明</span><span class="value">' + C.escapeHtml(detail.note) + '</span></div>' : "") +
        '</div>' +

        '<div class="card" style="margin-bottom:20px;">' +
          '<h3>品項</h3>' +
          renderItemsTable(detail.items) +
        '</div>' +

        '<div class="card" style="margin-bottom:20px;">' +
          '<h3>金額</h3>' +
          '<div class="calc-summary">' +
            '<div class="calc-row"><span>品項小計</span><span>' + formatCurrency(calc.subtotal) + '</span></div>' +
            '<div class="calc-row"><span>套用折扣後金額</span><span>' + formatCurrency(calc.afterDiscount) + '</span></div>' +
            '<div class="calc-row"><span>未稅金額</span><span>' + formatCurrency(calc.untaxed) + '</span></div>' +
            '<div class="calc-row"><span>稅額</span><span>' + formatCurrency(calc.tax) + '</span></div>' +
            '<div class="calc-row calc-total"><span>總金額（含稅）</span><span>' + formatCurrency(calc.total) + '</span></div>' +
          '</div>' +
        '</div>' +

        (detail.contractTerms ?
          '<div class="card" style="margin-bottom:20px;">' +
            '<h3>合約條款內容</h3>' +
            '<p class="value" style="white-space:pre-wrap;">' + C.escapeHtml(detail.contractTerms) + '</p>' +
          '</div>' : "") +

        '<div class="card" style="margin-bottom:20px;">' +
          '<h3>客戶簽署</h3>' +
          (detail.signedAt ?
            '<div class="detail-grid">' +
              '<div class="detail-row"><span class="label">簽署人</span><span class="value">' + C.escapeHtml(detail.signerName || "（未填）") + '</span></div>' +
              '<div class="detail-row"><span class="label">簽署時間</span><span class="value">' + C.escapeHtml(detail.signedAt) + '</span></div>' +
              '<div class="detail-row"><span class="label">已讀時間</span><span class="value">' + C.escapeHtml(detail.readAt || "（未填）") + '</span></div>' +
            '</div>' :
            '<div class="detail-grid">' +
              '<div class="detail-row"><span class="label">已讀時間</span><span class="value">' + C.escapeHtml(detail.readAt || "尚未開啟") + '</span></div>' +
            '</div>' +
            '<p class="form-hint" style="margin-top:10px;">尚未完成簽署</p>' +
            '<button type="button" class="btn btn-outline" id="gen-sign-link-btn" style="margin-top:10px;">產生簽署連結</button>'
          ) +
        '</div>' +

        '<div class="card">' +
          '<h3>付款資訊</h3>' +
          '<div class="form-grid">' +
            '<div class="form-field">' +
              '<label>付款狀態</label>' +
              '<select id="f-payment-status">' +
                PAYMENT_STATUSES.map(function (s) {
                  return '<option value="' + s + '"' + (s === (detail.paymentStatus || "未付款") ? ' selected' : '') + '>' + s + '</option>';
                }).join("") +
              '</select>' +
            '</div>' +
            '<div class="form-field">' +
              '<label>已收金額</label>' +
              '<input type="text" id="f-paid-amount" value="' + C.escapeHtml(detail.paidAmount || "") + '">' +
            '</div>' +
          '</div>' +
          '<button type="button" class="btn btn-gold" id="save-payment-btn" style="margin-top:12px;">更新付款狀態</button>' +
          '<p class="message" id="payment-message"></p>' +
        '</div>';

      var genLinkBtn = document.getElementById("gen-sign-link-btn");
      if (genLinkBtn) {
        genLinkBtn.addEventListener("click", async function () {
          genLinkBtn.disabled = true;
          try {
            var result = await C.apiFetch("/api/quotes/" + id + "/sign-link", { method: "POST" });
            var url = window.location.origin + "/quote-sign.html?token=" + result.token;
            window.prompt("請複製以下連結傳送給客戶（開啟連結免登入）：", url);
          } catch (err) {
            alert("產生連結失敗：" + err.message);
          } finally {
            genLinkBtn.disabled = false;
          }
        });
      }

      document.getElementById("save-payment-btn").addEventListener("click", async function () {
        var msgEl = document.getElementById("payment-message");
        var btn = document.getElementById("save-payment-btn");
        btn.disabled = true;
        C.showMessage(msgEl, "更新中…");
        try {
          await C.apiFetch("/api/quotes/" + id, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              paymentStatus: document.getElementById("f-payment-status").value,
              paidAmount: document.getElementById("f-paid-amount").value.trim(),
            }),
          });
          C.showMessage(msgEl, "已更新付款狀態", "success");
        } catch (err) {
          C.showMessage(msgEl, err.message || "更新失敗", "error");
        } finally {
          btn.disabled = false;
        }
      });
    } catch (err) {
      body.innerHTML = '<p class="empty-hint">無法載入（' + C.escapeHtml(err.message) + '）</p>';
    }
  }

  load();
})();
</script>
</body>
</html>
