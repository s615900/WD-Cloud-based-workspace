<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待辦事項 - 個人工作台</title>
<meta name="theme-color" content="#0B3D5C">
<link rel="stylesheet" href="/desktop/desktop.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-root"></aside>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>待辦事項</h1>
        <p class="subtitle">個人行程／待辦的完整清單，跟手機版任務資料庫一致</p>
      </div>
      <div class="page-actions">
        <a class="btn btn-gold" href="/desktop/add.html">+ 新增事項</a>
      </div>
    </div>

    <div class="card" style="margin-bottom: 20px;">
      <div style="display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end;">
        <div class="form-field" style="min-width:140px;">
          <label>類型</label>
          <select id="f-type">
            <option value="">全部</option>
            <option value="行程">行程</option>
            <option value="備忘">待辦</option>
          </select>
        </div>
        <div class="form-field" style="min-width:140px;">
          <label>狀態</label>
          <select id="f-status">
            <option value="">全部</option>
            <option value="準備中">準備中</option>
            <option value="完成">完成</option>
          </select>
        </div>
        <div class="form-field" style="flex:1; min-width:220px;">
          <label>關鍵字</label>
          <input type="text" id="f-keyword" placeholder="搜尋內容文字…">
        </div>
        <div class="form-field" style="min-width:0;">
          <button type="button" class="btn btn-outline" id="reset-btn">清除篩選</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="overflow-x: auto;">
        <table class="data-table">
          <thead>
            <tr><th>狀態</th><th>類型</th><th>內容</th><th>日期／時間</th><th>建立時間</th><th></th></tr>
          </thead>
          <tbody id="table-body"><tr><td colspan="6" class="empty-hint">載入中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-box">
    <h2>編輯待辦事項</h2>
    <form id="task-form">
      <input type="hidden" id="task-id">
      <div class="form-grid">
        <div class="form-field"><label>類型</label><p id="view-type" style="margin:0;"></p></div>
        <div class="form-field"><label>建立時間</label><p id="view-created" style="margin:0;"></p></div>
        <div class="form-field span-2">
          <label>內容</label>
          <p id="view-content" style="margin:0; white-space:pre-wrap;"></p>
        </div>
        <div class="form-field span-2">
          <label>狀態</label>
          <select id="f-edit-status">
            <option value="準備中">準備中</option>
            <option value="完成">完成</option>
          </select>
        </div>
      </div>
      <p class="message" id="form-message"></p>
      <div class="page-actions" style="margin-top: 16px; justify-content: flex-end;">
        <button type="button" class="btn btn-outline" id="cancel-btn">取消</button>
        <button type="submit" class="btn btn-primary" id="save-btn">儲存</button>
      </div>
    </form>
  </div>
</div>

<script src="/desktop/common.js"></script>
<script src="/desktop/nav.js" data-active="tasks"></script>
<script>
(function () {
  var C = window.DesktopCommon;
  var tasks = [];

  var TYPE_BADGE = { 行程: "badge-teal", 備忘: "badge-muted" };

  // 「備忘」是內部沿用的類型值，顯示給使用者看的文字一律用「待辦」
  function labelForType(type) {
    return type === "備忘" ? "待辦" : type;
  }

  function statusBadge(status) {
    var cls = status === "完成" ? "badge-teal" : "badge-gold";
    return '<span class="badge ' + cls + '">' + C.escapeHtml(status) + '</span>';
  }

  function typeBadge(type) {
    var cls = TYPE_BADGE[type] || "badge";
    return '<span class="badge ' + cls + '">' + C.escapeHtml(labelForType(type)) + '</span>';
  }

  async function load() {
    var body = document.getElementById("table-body");
    body.innerHTML = '<tr><td colspan="6" class="empty-hint">載入中…</td></tr>';

    var type = document.getElementById("f-type").value;
    var status = document.getElementById("f-status").value;
    var keyword = document.getElementById("f-keyword").value.trim();

    var query = new URLSearchParams();
    if (type) query.set("type", type);
    if (keyword) query.set("keyword", keyword);

    try {
      var all = await C.apiFetch("/api/tasks" + (query.toString() ? "?" + query.toString() : ""));
      tasks = status ? all.filter(function (t) { return t.status === status; }) : all;
      renderRows();
    } catch (err) {
      body.innerHTML = '<tr><td colspan="6" class="empty-hint">無法載入（' + C.escapeHtml(err.message) + '）</td></tr>';
    }
  }

  function renderRows() {
    var body = document.getElementById("table-body");
    if (tasks.length === 0) {
      body.innerHTML = '<tr><td colspan="6" class="empty-hint">沒有符合的待辦事項</td></tr>';
      return;
    }
    // 用陣列索引（不是 t.id）當列的識別鍵：/ragicforms21/1（待辦）跟 /ragicforms21/8
    // （排班行程）各自的紀錄編號互不相干，同一份清單裡可能撞號，拿 id 找列會找錯筆。
    body.innerHTML = tasks.map(function (t, idx) {
      var when = (t.date ? t.date + (t.time ? " " + t.time : "") : "（未排定）");
      var actionLabel = t.source === "schedule" ? "檢視" : "編輯";
      return '<tr class="task-row" data-idx="' + idx + '" style="cursor:pointer;">' +
        '<td>' + statusBadge(t.status) + '</td>' +
        '<td>' + typeBadge(t.type) + '</td>' +
        '<td>' + C.escapeHtml(t.content) + '</td>' +
        '<td>' + C.escapeHtml(when) + '</td>' +
        '<td class="form-hint">' + C.escapeHtml(t.createdAt) + '</td>' +
        '<td><button type="button" class="btn btn-outline" data-idx="' + idx + '" style="padding:5px 12px;font-size:12px;" onclick="event.stopPropagation()">' + actionLabel + '</button></td>' +
        '</tr>';
    }).join("");

    body.querySelectorAll("[data-idx]").forEach(function (el) {
      el.addEventListener("click", function () { openItem(Number(el.dataset.idx)); });
    });
  }

  // 排班行程（/ragicforms21/8）在這頁唯讀，點「檢視」直接導去行事曆對應日期；
  // 只有待辦／備忘（/ragicforms21/1）才會開編輯彈窗。
  function openItem(idx) {
    var t = tasks[idx];
    if (!t) return;
    if (t.source === "schedule") {
      viewInCalendar(t);
      return;
    }
    openModal(t);
  }

  function viewInCalendar(t) {
    // createdAt 對排班行程來說就是「yyyy/mm/dd HH:mm:00」（見 scheduleEntryToTaskListItem），
    // 取前 10 碼換成 yyyy-mm-dd 即可，不需要額外欄位。
    var iso = (t.createdAt || "").slice(0, 10).replaceAll("/", "-");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
    window.location.href = "/desktop/calendar.html?date=" + iso;
  }

  var overlay = document.getElementById("modal-overlay");
  var messageEl = document.getElementById("form-message");

  function openModal(t) {
    document.getElementById("task-id").value = t.id;
    document.getElementById("view-type").textContent = labelForType(t.type);
    document.getElementById("view-created").textContent = t.createdAt;
    document.getElementById("view-content").textContent = t.content;
    document.getElementById("f-edit-status").value = t.status === "完成" ? "完成" : "準備中";
    C.showMessage(messageEl, "");
    overlay.classList.remove("hidden");
  }

  function closeModal() { overlay.classList.add("hidden"); }

  document.getElementById("cancel-btn").addEventListener("click", closeModal);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });

  document.getElementById("task-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    var id = document.getElementById("task-id").value;
    var status = document.getElementById("f-edit-status").value;

    var saveBtn = document.getElementById("save-btn");
    saveBtn.disabled = true;
    C.showMessage(messageEl, "儲存中…");
    try {
      await C.apiFetch("/api/tasks/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: status, source: "todo" }),
      });
      closeModal();
      load();
    } catch (err) {
      C.showMessage(messageEl, err.message || "儲存失敗", "error");
    } finally {
      saveBtn.disabled = false;
    }
  });

  document.getElementById("f-type").addEventListener("change", load);
  document.getElementById("f-status").addEventListener("change", load);
  document.getElementById("f-keyword").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); load(); } });
  document.getElementById("reset-btn").addEventListener("click", function () {
    document.getElementById("f-type").value = "";
    document.getElementById("f-status").value = "";
    document.getElementById("f-keyword").value = "";
    load();
  });

  load();
})();
</script>
</body>
</html>
