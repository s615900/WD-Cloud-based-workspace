<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專案進度 - 個人工作台</title>
<meta name="theme-color" content="#0B3D5C">
<link rel="stylesheet" href="/desktop/desktop.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-root"></aside>
  <main class="main-content" style="max-width: none;">
    <div class="page-header">
      <div>
        <h1>攝影專案管理</h1>
        <p class="subtitle">對應 Ragic quotation-system/13・拖曳卡片即可切換狀態</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-gold" id="new-btn">+ 新增專案</button>
      </div>
    </div>

    <div class="card" id="lock-notice" style="display:none; text-align:center; padding:56px 24px;">
      <div style="font-size:42px; margin-bottom:14px;">🔒</div>
      <h2 style="margin:0 0 8px;">這個功能暫時鎖定</h2>
      <p class="subtitle" style="margin:0;">接案商業功能目前暫停使用，資料不會讀取或異動</p>
    </div>

    <div class="card">
      <div class="card-title-row">
        <h3>專案進度看板</h3>
        <span class="subtitle" style="font-size:12px;">拖曳卡片可切換階段</span>
      </div>
      <div class="kanban-board" id="board"></div>
    </div>
    <div id="cancelled-section"></div>
  </main>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-box">
    <h2>新增專案</h2>
    <form id="project-form">
      <div class="form-grid">
        <div class="form-field span-2">
          <label>選擇來源報價單<span class="required">*</span></label>
          <select id="f-quote"><option value="">載入中…</option></select>
          <p class="form-hint">格式：報價單編號 - 客戶名稱 - 總金額(含稅)</p>
        </div>
        <div class="form-field">
          <label>客戶名稱</label>
          <input type="text" id="f-client-name" disabled>
        </div>
        <div class="form-field">
          <label>聯絡人</label>
          <input type="text" id="f-contact" disabled>
        </div>
        <div class="form-field">
          <label>公司電話</label>
          <input type="text" id="f-company-phone" disabled>
        </div>
        <div class="form-field">
          <label>電子郵件</label>
          <input type="text" id="f-email" disabled>
        </div>
        <div class="form-field">
          <label>拍攝日期<span class="required">*</span></label>
          <input type="date" id="f-shoot-date">
        </div>
        <div class="form-field">
          <label>專案類型</label>
          <select id="f-project-type">
            <option value="">請選擇類型</option>
            <option value="婚禮紀錄">婚禮紀錄</option>
            <option value="商業攝影">商業攝影</option>
            <option value="人像寫真">人像寫真</option>
            <option value="活動紀錄">活動紀錄</option>
            <option value="空間攝影">空間攝影</option>
            <option value="形象照">形象照</option>
            <option value="其他">其他</option>
          </select>
        </div>
      </div>
      <p class="form-hint">以上客戶資訊隨選定的報價單自動帶入；專案狀態新增時一律預設「洽談中」，之後在看板拖曳卡片切換。</p>
      <p class="message" id="form-message"></p>
      <div class="page-actions" style="margin-top: 16px; justify-content: flex-end;">
        <button type="button" class="btn btn-outline" id="cancel-btn">取消</button>
        <button type="submit" class="btn btn-primary" id="save-btn">儲存</button>
      </div>
    </form>
  </div>
</div>

<script src="/desktop/common.js"></script>
<script src="/desktop/nav.js" data-active="projects"></script>
<script>
(function () {
  var C = window.DesktopCommon;
  var STATUSES = ["洽談中", "籌備中", "拍攝中", "後製修圖", "客戶校稿", "已結案"];
  var CANCEL_STATUS = "取消";
  var quoteMap = {};          // 依報價單的 Ragic 紀錄編號查找，給「選擇來源報價單」下拉選單用
  var quotesByProjectCode = {}; // 依報價單自己的「專案編號」（P-code）查找，給看板卡片顯示報價單編號用
  var projects = [];

  function quoteOptionLabel(q) {
    return (q.quoteNumber || ("#" + q.id)) + " - " + (q.clientName || "") + " - " + (q.totalAmount || "");
  }

  async function updateStatus(id, newStatus) {
    var project = projects.find(function (p) { return p.id === id; });
    if (!project || project.status === newStatus) return;
    var prevStatus = project.status;
    project.status = newStatus;
    renderBoard();
    try {
      await C.apiFetch("/api/projects/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: newStatus }),
      });
    } catch (err) {
      project.status = prevStatus;
      renderBoard();
      alert(err.message || "更新狀態失敗");
    }
  }

  function cardInnerHtml(p, opts) {
    var quote = quotesByProjectCode[p.projectCode];
    var quoteLabel = quote ? (quote.quoteNumber || "—") : "—";
    var typeBadge = p.projectType ? '<span class="badge badge-gold">' + C.escapeHtml(p.projectType) + '</span>' : "";
    var link = p.deliveryLink ? '<div class="form-hint"><a href="' + C.escapeHtml(p.deliveryLink) + '" target="_blank" rel="noopener">交付連結 ›</a></div>' : "";
    return '<div style="font-weight:700;margin-bottom:4px;">' + C.escapeHtml(quoteLabel) + '　' + C.escapeHtml(p.clientName || "") + '</div>' +
      '<div style="margin-bottom:6px;">' + typeBadge + '</div>' +
      '<div class="form-hint">拍攝日期：' + C.escapeHtml(p.shootDate || "—") + '</div>' + link +
      (opts && opts.cancelLink ? '<div class="card-cancel-link" data-id="' + p.id + '">設為取消</div>' : "") +
      (opts && opts.restoreSelect ? '<select class="card-restore-select" data-id="' + p.id + '">' +
        '<option value="">恢復為…</option>' +
        STATUSES.map(function (s) { return '<option value="' + s + '">' + s + '</option>'; }).join("") +
        '</select>' : "");
  }

  function renderBoard() {
    var board = document.getElementById("board");
    board.innerHTML = STATUSES.map(function (status) {
      var cards = projects.filter(function (p) { return p.status === status; });
      var cardsHtml = cards.map(function (p) {
        return '<div class="kanban-card" draggable="true" data-id="' + p.id + '">' + cardInnerHtml(p, { cancelLink: true }) + '</div>';
      }).join("");
      return '<div class="kanban-column" data-status="' + status + '"><h3>' + status + '（' + cards.length + '）</h3>' + cardsHtml + '</div>';
    }).join("");

    board.querySelectorAll(".kanban-card").forEach(function (card) {
      card.addEventListener("dragstart", function (e) {
        e.dataTransfer.setData("text/plain", card.dataset.id);
      });
    });
    board.querySelectorAll(".kanban-column").forEach(function (col) {
      col.addEventListener("dragover", function (e) { e.preventDefault(); col.classList.add("drag-over"); });
      col.addEventListener("dragleave", function () { col.classList.remove("drag-over"); });
      col.addEventListener("drop", function (e) {
        e.preventDefault();
        col.classList.remove("drag-over");
        var id = Number(e.dataTransfer.getData("text/plain"));
        updateStatus(id, col.dataset.status);
      });
    });
    board.querySelectorAll(".card-cancel-link").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = Number(el.dataset.id);
        if (confirm("確定要將此專案設為取消？")) updateStatus(id, CANCEL_STATUS);
      });
    });

    renderCancelledSection();
  }

  function renderCancelledSection() {
    var container = document.getElementById("cancelled-section");
    var cancelled = projects.filter(function (p) { return p.status === CANCEL_STATUS; });
    if (!cancelled.length) { container.innerHTML = ""; return; }
    var cardsHtml = cancelled.map(function (p) {
      return '<div class="kanban-card">' + cardInnerHtml(p, { restoreSelect: true }) + '</div>';
    }).join("");
    container.innerHTML = '<details class="kanban-cancelled-section">' +
      '<summary>已取消專案（' + cancelled.length + '）</summary>' +
      '<div style="margin-top:10px;">' + cardsHtml + '</div></details>';

    container.querySelectorAll(".card-restore-select").forEach(function (sel) {
      sel.addEventListener("change", function () {
        var id = Number(sel.dataset.id);
        var newStatus = sel.value;
        if (newStatus) updateStatus(id, newStatus);
      });
    });
  }

  async function loadLookups() {
    try {
      var quotes = await C.apiFetch("/api/quotes");
      quoteMap = {};
      quotesByProjectCode = {};
      quotes.forEach(function (q) {
        quoteMap[q.id] = q;
        if (q.projectCode) quotesByProjectCode[q.projectCode] = q;
      });
      document.getElementById("f-quote").innerHTML = '<option value="">請選擇報價單</option>' + quotes.map(function (q) {
        return '<option value="' + q.id + '">' + C.escapeHtml(quoteOptionLabel(q)) + '</option>';
      }).join("") || '<option value="">尚無報價單</option>';
    } catch (e) { document.getElementById("f-quote").innerHTML = '<option value="">載入失敗</option>'; }
  }

  async function load() {
    try {
      projects = await C.apiFetch("/api/projects");
      renderBoard();
    } catch (err) {
      document.getElementById("board").innerHTML = '<p class="empty-hint">無法載入（' + C.escapeHtml(err.message) + '）</p>';
    }
  }

  // 選定報價單後，Ragic 表單端的「同時載入其他欄位」不會因為 API POST 而觸發，
  // 所以這裡把報價單上的客戶資訊自己抓出來顯示＋準備好一起送出，不能只送報價單號。
  // 客戶編號（連結欄位寫入依據）也是跟著報價單一起帶，不再讓使用者另外選客戶。
  function applyQuoteSelection() {
    var quoteId = document.getElementById("f-quote").value;
    var quote = quoteMap[quoteId];
    document.getElementById("f-client-name").value = quote ? (quote.clientName || "") : "";
    document.getElementById("f-contact").value = quote ? (quote.contact || "") : "";
    document.getElementById("f-company-phone").value = quote ? (quote.companyPhone || "") : "";
    document.getElementById("f-email").value = quote ? (quote.email || "") : "";
  }

  var overlay = document.getElementById("modal-overlay");
  document.getElementById("f-quote").addEventListener("change", applyQuoteSelection);

  document.getElementById("new-btn").addEventListener("click", function () {
    document.getElementById("project-form").reset();
    applyQuoteSelection();
    C.showMessage(document.getElementById("form-message"), "");
    overlay.classList.remove("hidden");
  });
  document.getElementById("cancel-btn").addEventListener("click", function () { overlay.classList.add("hidden"); });
  overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.classList.add("hidden"); });

  document.getElementById("project-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    var messageEl = document.getElementById("form-message");
    var quoteId = document.getElementById("f-quote").value;
    var quote = quoteMap[quoteId];
    var shootDate = document.getElementById("f-shoot-date").value;
    var projectType = document.getElementById("f-project-type").value;
    if (!quoteId || !quote) { C.showMessage(messageEl, "請選擇報價單", "error"); return; }
    if (!quote.clientId) { C.showMessage(messageEl, "所選報價單缺少客戶編號連結，請先回報價單補上客戶", "error"); return; }
    if (!quote.projectCode) { C.showMessage(messageEl, "所選報價單缺少專案編號，請先回報價單確認", "error"); return; }
    if (!shootDate) { C.showMessage(messageEl, "請填寫拍攝日期", "error"); return; }

    var saveBtn = document.getElementById("save-btn");
    saveBtn.disabled = true;
    C.showMessage(messageEl, "儲存中…");
    var payload = {
      quoteId: quoteId,
      projectCode: quote.projectCode,
      clientId: quote.clientId,
      contact: quote.contact || "",
      clientName: quote.clientName || "",
      companyPhone: quote.companyPhone || "",
      email: quote.email || "",
      shootDate: shootDate,
      projectType: projectType || undefined,
      status: "洽談中",
    };
    try {
      var created = await C.apiFetch("/api/projects", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      overlay.classList.add("hidden");
      // 存檔成功後直接把新專案插入畫面對應欄位，不整頁重新整理、不重打 GET /api/projects。
      projects.push({
        id: created.id,
        projectCode: payload.projectCode,
        clientId: quote.clientId,
        contact: payload.contact,
        clientName: payload.clientName,
        companyPhone: payload.companyPhone,
        email: payload.email,
        shootDate: shootDate.replaceAll("-", "/"),
        projectType: projectType || "",
        status: "洽談中",
        deliveryLink: "",
      });
      renderBoard();
    } catch (err) {
      C.showMessage(messageEl, err.message || "儲存失敗", "error");
    } finally {
      saveBtn.disabled = false;
    }
  });

  C.getBusinessLocks().then(function (locks) {
    if (C.applyBusinessLock(locks.projects, { hideIds: ["new-btn", "board", "cancelled-section"] })) return;
    loadLookups().then(load);
  });
})();
</script>
</body>
</html>
