<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合約 - 個人工作台</title>
<meta name="theme-color" content="#0B3D5C">
<link rel="stylesheet" href="/desktop/desktop.css">
</head>
<body>
<div class="app-shell">
  <aside id="sidebar-root"></aside>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>合約</h1>
        <p class="subtitle">對應 Ragic quotation-system/12</p>
      </div>
      <div class="page-actions">
        <a class="btn btn-gold" id="new-btn" href="/desktop/contracts-new.html">+ 新增合約</a>
      </div>
    </div>

    <div class="card" id="lock-notice" style="display:none; text-align:center; padding:56px 24px;">
      <div style="font-size:42px; margin-bottom:14px;">🔒</div>
      <h2 style="margin:0 0 8px;">這個功能暫時鎖定</h2>
      <p class="subtitle" style="margin:0;">接案商業功能目前暫停使用，資料不會讀取或異動</p>
    </div>

    <div class="card" id="data-card">
      <div style="overflow-x: auto;">
        <table class="data-table">
          <thead><tr><th>合約編號</th><th>報價單</th><th>客戶名稱</th><th>合約金額</th><th>狀態</th><th>簽核狀態</th><th>NDA</th><th>客戶簽署</th><th>負責人簽署</th><th></th></tr></thead>
          <tbody id="table-body"><tr><td colspan="10" class="empty-hint">載入中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="/desktop/common.js"></script>
<script src="/desktop/nav.js" data-active="contracts"></script>
<script>
(function () {
  var C = window.DesktopCommon;
  var STATUSES = ["草稿", "已發送", "已簽約", "已結案", "作廢"];

  function formatCurrency(n) {
    var rounded = Math.round((Number(n) || 0) * 100) / 100;
    return "$" + rounded.toLocaleString("en-US");
  }

  function signedBadge(signedAt) {
    return signedAt
      ? '<span class="badge badge-teal">✓ 已簽署</span>'
      : '<span class="badge badge-muted">未簽署</span>';
  }

  function approvalBadge(signStatus) {
    var cls = { "簽核完成": "badge-teal", "簽核中": "badge-gold", "已拒絕": "badge-danger" }[signStatus] || "badge-muted";
    return '<span class="badge ' + cls + '">' + C.escapeHtml(signStatus || "未簽核") + '</span>';
  }

  function ndaBadge(nda) {
    return nda
      ? '<span class="badge badge-nda">含 NDA</span>'
      : '<span style="color:var(--text-muted);font-size:12px;">—</span>';
  }

  async function load() {
    var body = document.getElementById("table-body");
    body.innerHTML = '<tr><td colspan="10" class="empty-hint">載入中…</td></tr>';
    try {
      var contracts = await C.apiFetch("/api/contracts");
      if (contracts.length === 0) {
        body.innerHTML = '<tr><td colspan="10" class="empty-hint">尚無合約</td></tr>';
        return;
      }
      renderRows(contracts);
    } catch (err) {
      body.innerHTML = '<tr><td colspan="10" class="empty-hint">無法載入（' + C.escapeHtml(err.message) + '）</td></tr>';
    }
  }

  // 整列可點擊進入詳情頁；狀態下拉、傳送簽署連結按鈕另外處理，用 stopPropagation
  // 避免同時觸發整列的詳情頁導覽。
  function renderRows(contracts) {
    var body = document.getElementById("table-body");
    body.innerHTML = contracts.map(function (c) {
      var options = STATUSES.map(function (s) {
        return '<option value="' + s + '"' + (s === c.status ? " selected" : "") + '>' + s + '</option>';
      }).join("");
      return '<tr class="contract-row" data-id="' + c.id + '" style="cursor:pointer;">' +
        '<td>' + C.escapeHtml(c.contractNumber || "#" + c.id) + '</td>' +
        '<td>' + C.escapeHtml(c.quoteNumber) + '</td>' +
        '<td>' + C.escapeHtml(c.clientName) + '</td>' +
        '<td style="font-weight:700;">' + formatCurrency(c.amount) + '</td>' +
        '<td><select data-id="' + c.id + '" class="status-select" onclick="event.stopPropagation()">' + options + '</select></td>' +
        '<td>' + approvalBadge(c.signStatus) + '</td>' +
        '<td>' + ndaBadge(c.nda) + '</td>' +
        '<td>' + signedBadge(c.customerSignedAt) + '</td>' +
        '<td>' + signedBadge(c.staffSignedAt) + '</td>' +
        '<td style="white-space:nowrap;">' +
          '<button type="button" class="btn btn-outline sign-link-btn" data-id="' + c.id + '" style="padding:5px 12px;font-size:12px;">傳送簽署連結</button>' +
        '</td>' +
        '</tr>';
    }).join("");

    body.querySelectorAll(".contract-row").forEach(function (row) {
      row.addEventListener("click", function () {
        window.location.href = "/desktop/contracts-detail.html?id=" + row.dataset.id;
      });
    });

    body.querySelectorAll(".status-select").forEach(function (select) {
      select.addEventListener("change", async function () {
        select.disabled = true;
        try {
          await C.apiFetch("/api/contracts/" + select.dataset.id, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: select.value }),
          });
        } catch (err) {
          alert(err.message || "更新狀態失敗");
        } finally {
          select.disabled = false;
        }
      });
    });

    body.querySelectorAll(".sign-link-btn").forEach(function (btn) {
      btn.addEventListener("click", async function (event) {
        event.stopPropagation();
        btn.disabled = true;
        try {
          var result = await C.apiFetch("/api/contracts/" + btn.dataset.id + "/sign-link", { method: "POST" });
          var url = window.location.origin + "/contract-sign.html?token=" + result.token;
          window.prompt("請複製以下連結傳送給客戶（開啟連結免登入）：", url);
        } catch (err) {
          alert("產生連結失敗：" + err.message);
        } finally {
          btn.disabled = false;
        }
      });
    });
  }

  C.getBusinessLocks().then(function (locks) {
    if (C.applyBusinessLock(locks.contracts, { hideIds: ["new-btn", "data-card"] })) return;
    load();
  });
})();
</script>
</body>
</html>
